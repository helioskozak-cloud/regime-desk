// METHODOLOGY — with jargon glossary

// ── Chart primitives ─────────────────────────────────────────────────────────

function svgLineChart(vals, w, h, label) {
  if(!vals||vals.length<2) return `<div style="color:#6f6f6f;text-align:center;padding:20px;font-size:12px">No history data</div>`;
  const mn=Math.min(...vals,0), mx=Math.max(...vals,0.001), range=mx-mn||0.01;
  const pl=44,pr=54,pt=12,pb=20, pw=w-pl-pr, ph=h-pt-pb;
  const cx=i=>pl+i/(vals.length-1)*pw, cy=v=>pt+ph-(v-mn)/range*ph;
  const zY=cy(0);
  const pts=vals.map((v,i)=>`${cx(i).toFixed(1)},${cy(v).toFixed(1)}`).join(' ');
  const last=vals[vals.length-1], lc=last>=0?'#3fae6a':'#e5484d';
  const area=`${pl},${zY.toFixed(1)} ${pts} ${(pl+pw).toFixed(1)},${zY.toFixed(1)}`;
  const xLabels=[0,Math.floor((vals.length-1)/2),vals.length-1]
    .map((i,j)=>`<text x="${cx(i).toFixed(1)}" y="${pt+ph+14}" text-anchor="middle" font-size="9" fill="#6f6f6f">${['20d ago','10d ago','Today'][j]}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">
    <text x="${pl+pw/2}" y="9" text-anchor="middle" font-size="9" fill="#8f8f8f">${label}</text>
    <line x1="${pl}" y1="${zY.toFixed(1)}" x2="${pl+pw}" y2="${zY.toFixed(1)}" stroke="#2e2e2e" stroke-dasharray="3,2"/>
    <polygon points="${area}" fill="${lc}" opacity="0.1"/>
    <polyline points="${pts}" fill="none" stroke="${lc}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${cx(vals.length-1).toFixed(1)}" cy="${cy(last).toFixed(1)}" r="4" fill="${lc}"/>
    <text x="${pl-4}" y="${cy(mx).toFixed(1)}" text-anchor="end" dominant-baseline="middle" font-size="9" fill="#6f6f6f">${(mx*100).toFixed(1)}%</text>
    <text x="${pl-4}" y="${cy(mn).toFixed(1)}" text-anchor="end" dominant-baseline="middle" font-size="9" fill="#6f6f6f">${(mn*100).toFixed(1)}%</text>
    <text x="${(pl+pw+6).toFixed(1)}" y="${cy(last).toFixed(1)}" dominant-baseline="middle" font-size="11" font-weight="600" fill="${lc}">${(last*100>=0?'+':'')+(last*100).toFixed(1)}%</text>
    ${xLabels}
  </svg>`;
}

function svgSectorBars(sectors) {
  const FACTOR={'Technology':'Growth','Semiconductors':'Growth','Healthcare':'Quality',
    'Financials':'Value','Consumer Discretionary':'Cyclical','Communication Services':'Growth',
    'Industrials':'Cyclical','Consumer Staples':'Defensive','Energy':'Value',
    'Utilities':'Defensive','Real Estate':'Income','Materials':'Cyclical',
    'Biotech':'Speculative','Defense':'Defensive','Crypto':'Speculative'};
  const FCOL={'Growth':'#5b9dff','Value':'#d4a72c','Quality':'#3fae6a','Cyclical':'#f0883e',
    'Defensive':'#8f8f8f','Income':'#a371f7','Speculative':'#e5484d','—':'#6f6f6f'};
  const n=sectors.length, maxAbs=Math.max(...sectors.map(s=>Math.abs(s.edge)),0.05);
  const barH=24, pl=160, pr=64, pt=20, pb=4, w=640, pw=w-pl-pr, h=n*barH+pt+pb;
  const midX=pl+pw/2;
  const header=`<text x="${midX}" y="12" text-anchor="middle" font-size="9" fill="#6f6f6f">← Underperform  |  Outperform →</text>
    <line x1="${midX}" y1="${pt}" x2="${midX}" y2="${h-pb}" stroke="#2e2e2e"/>`;
  const rows=sectors.map((s,i)=>{
    const y=pt+i*barH, bw=(Math.abs(s.edge)/maxAbs)*(pw/2);
    const bx=s.edge>=0?midX:midX-bw, col=s.edge>=0?'#2b7a4b':'#b91c1c';
    const badge=i<3?'🏆':i>=n-3?'⚠️':'';
    const factor=FACTOR[s.name]||'—', fc=FCOL[factor]||'#6f6f6f';
    const valX=(s.edge>=0?midX+bw+4:midX-bw-4).toFixed(1);
    const valAnchor=s.edge>=0?'start':'end';
    return `${badge?`<text x="${pl-152}" y="${y+barH/2}" dominant-baseline="middle" font-size="12">${badge}</text>`:''}
    <rect x="${(pl-144)}" y="${y+5}" width="52" height="${barH-10}" fill="${fc}18" rx="3" stroke="${fc}" stroke-width="0.5"/>
    <text x="${pl-118}" y="${y+barH/2}" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="${fc}">${factor}</text>
    <text x="${pl-8}" y="${y+barH/2}" text-anchor="end" dominant-baseline="middle" font-size="11" fill="#c9c9c9">${s.name}</text>

function svgRiskBars(risks) {

    </div>

      <tr style="color:#8f8f8f;font-size:10px;text-transform:uppercase;letter-spacing:.5px">

  </div>`:`<div style="background:#0e0e0e;border:1px dashed #2e2e2e;border-radius:4px;padding:14px;margin-top:4px;color:#8f8f8f;font-size:12px;line-height:1.6">
    The 30 actual analog dates from today's scan are used internally to compute every stock's edge, but they aren't yet persisted into <code style="background:#141414;padding:1px 5px;border-radius:3px;color:#c9c9c9">spy_state.json</code> for display here. The dates exist; they just don't make it to the snapshot.
  </div>`;

  // SPY's own next-20-session return from each analog day, measured by the

  const fwd=a.spy_fwd||{},fwdBase=fwd.base||null,fwdOk=a.spy_p50!=null;

      </div>
      <div style="width:48px;font-size:11px;font-weight:600;color:${color};text-align:right">${val>=0?'+':''}${(val*100).toFixed(1)}%</div>
    </div>`;
  };

  const terms=[
    ["Edge","Conditional median return minus unconditional baseline. How much better a stock performs in analog conditions vs any random day."],
    ["Analog","A historical day whose SPY state is closest to today's, by Euclidean distance after z-score normalization across 4 dimensions."],
    ["Hit Rate","Fraction of resolved signals where the actual return matched or beat the predicted edge."],
    ["Breadth","Fraction of stocks in a sector with positive conditional edge. High breadth means widespread participation, not a few outliers."],
    ["p10 / p50 / p90","On a stock row: the 10th, 50th and 90th percentile of that stock's forward returns across the analog days. On the analog tile: the same for SPY over the next 20 sessions, set against every day in the history."],
  ];

  return`<div class="card"><h2>Analog Matching</h2>

  <div style="font-size:12px;color:#8f8f8f;margin-bottom:14px">${a.regime_context||''}</div>
  ${precedentsBlock}
  </div>

  <div class="card"><h2>How This Works — Methodology</h2>
  <div style="line-height:1.7;font-size:13px;color:#c9c9c9">
    <p style="margin-bottom:10px"><strong style="color:#f2f2f2">1 · State vector.</strong> Reduce today's market to 4 numbers: SPY 5-day return, 20-day return, 20-day realized volatility, and 60-day drawdown.</p>
    <p style="margin-bottom:10px"><strong style="color:#f2f2f2">2 · Analog matching.</strong> Z-score each dimension across all SPY history, then pick the 30 historical days closest to today by Euclidean distance. The most recent 30 days are excluded so we don't match today to itself.</p>
    <p style="margin-bottom:10px"><strong style="color:#f2f2f2">3 · Conditional returns.</strong> For every stock, look at what happened over the next 5 / 20 / 60 / 120 trading days following each analog. That produces a distribution of forward returns, not a point forecast.</p>
    <p style="margin-bottom:10px"><strong style="color:#f2f2f2">4 · Edge.</strong> <code style="background:#141414;padding:1px 5px;border-radius:3px">edge = conditional median − unconditional median</code>. Only signals with edge ≥ 5% and at least 5 observations are kept.</p>
    <p style="margin-bottom:6px"><strong style="color:#f2f2f2">Eligibility filters.</strong> Stocks with 20-day realized vol above 5% / day are excluded. Per LPL compliance, stocks priced under $5 today — or with more than 10% of their trailing closes under $5 — are removed. Leveraged and inverse products are filtered out by name.</p>
  </div>
  </div>

  <div class="card" style="border-left:3px solid #d4a72c;padding-left:12px">
  <h2 style="color:#d4a72c">Limitations</h2>
  <div style="line-height:1.65;font-size:13px;color:#c9c9c9">
    <p style="margin-bottom:8px"><strong style="color:#f2f2f2">Small samples.</strong> Five observations is the floor; many signals sit near it. Hit rates and p-percentiles from tiny samples are noisy — don't over-weight them.</p>
    <p style="margin-bottom:8px"><strong style="color:#f2f2f2">Regime shifts.</strong> A 3-year lookback can miss structural changes (rate regime, AI capex cycle, dollar trends). When the world genuinely changes, analog matching breaks because the new state has no real historical twin.</p>
    <p style="margin-bottom:8px"><strong style="color:#f2f2f2">No causation.</strong> Pattern matching describes co-occurrence, not mechanism. If a stock historically ran in similar setups, the model doesn't know <em>why</em>.</p>
    <p style="margin-bottom:0"><strong style="color:#f2f2f2">Tendencies, not forecasts.</strong> A 60% hit rate means the same setup paid off 6 out of 10 times in history. That's an edge, not a guarantee.</p>
  </div>
  </div>

  <div class="card"><h2>Glossary</h2>
  <div>
    ${terms.map(([t,d])=>`<div style="margin-bottom:10px"><strong style="color:#f2f2f2">${t}:</strong> <span style="color:#8f8f8f;font-size:12px">${d}</span></div>`).join('')}

function renderBubble(){
  const bw=S.bubble_watch||{};
  const years=bw.years||[];
  if(!years.length)return`<div class="card"><h2>Bubble Watch</h2><p style="color:#8f8f8f;padding:20px 0">Bubble data not yet available — scan/bubble_scan.py hasn't written data/bubble_watch.json yet. Check back after the next daily run.</p></div><footer>Tendencies only — not investment advice.</footer>`;
  const dotcom=years.filter(y=>y.year<=2002), ai=years.filter(y=>y.year>=2021);
  const latest=ai[ai.length-1]||years[years.length-1];
  const peak99=years.find(y=>y.year===1999);
  const churnNow=latest.pct_doubled+latest.pct_halved;
  const churn99=peak99?(peak99.pct_doubled+peak99.pct_halved):9.37;
  const churnRatio=Math.round(100*churnNow/churn99);
  const flipLit=latest.pct_halved>latest.pct_doubled;
  const maxUp=Math.max(...years.map(y=>y.pct_doubled))*1.15+0.5;
  const maxDn=Math.max(...years.map(y=>y.pct_halved))*1.1+0.5;
  function tile(k,v,d,vc){return`<div style="background:#0e0e0e;border:1px solid #2e2e2e;border-radius:4px;padding:12px 14px;flex:1;min-width:170px"><div style="color:#6f6f6f;font-size:10px;text-transform:uppercase;letter-spacing:.6px">${k}</div><div style="font-size:22px;font-weight:700;margin:3px 0 1px;color:${vc||'#f2f2f2'};font-family:var(--mono)">${v}</div><div style="color:#8f8f8f;font-size:11px">${d}</div></div>`;}
  function bubblePanel(rows,title){
    const W=460,H=300,T=24,B=34,L=38,R=6;
    const ih=H-T-B, y0=T+ih*maxUp/(maxUp+maxDn);
    const yUp=v=>y0-(v/maxUp)*(y0-T), yDn=v=>y0+(v/maxDn)*(H-B-y0);
    const step=(W-L-R)/rows.length, bwid=Math.min(24,step*0.46);
    let s='';
    [5,-5,-10].forEach(g=>{if(g>0&&g>maxUp)return;if(g<0&&-g>maxDn)return;
      const gy=g>=0?yUp(g):yDn(-g);
      s+=`<line x1="${L}" x2="${W-R}" y1="${gy}" y2="${gy}" stroke="#141414"/><text x="${L-5}" y="${gy+3.5}" text-anchor="end" font-size="9.5" fill="#6f6f6f">${g>0?'+':''}${g}%</text>`;});
    rows.forEach((d,i)=>{

    if(mins<60) return {hh:hh,rel:Math.floor(mins)+'m'};
    if(mins<60*8) return {hh:hh,rel:Math.floor(mins/60)+'h'};
    return {hh:hh,rel:d.toLocaleDateString('en-US',{month:'numeric',day:'numeric',timeZone:'UTC'})};
  }
  function groupKey(iso){
    if(!iso) return 'UNDATED';
    var d=new Date(iso);
    if(isNaN(d.getTime())) return 'UNDATED';
    var today=new Date(); today.setUTCHours(0,0,0,0);
    var yest=new Date(today.getTime()-86400000);
    var start=new Date(d.getTime()); start.setUTCHours(0,0,0,0);
    if(start.getTime()===today.getTime()) return 'TODAY';
    if(start.getTime()===yest.getTime()) return 'YESTERDAY';
    return d.toLocaleDateString('en-US',
      {weekday:'long',month:'short',day:'numeric',timeZone:'UTC'}).toUpperCase();
  }
  function fmtUpdated(){
    if(S.failed&&!S.headlines.length) return 'feed unreachable';
    if(!S.generated) return 'connecting…';
    var d=new Date(S.generated);
    if(isNaN(d.getTime())) return 'updated';
    var secs=(Date.now()-d.getTime())/1000;
    if(secs<60) return 'updated just now';
    if(secs<3600) return 'updated '+Math.floor(secs/60)+'m ago';
    return 'updated '+Math.floor(secs/3600)+'h ago';
  }
  function stale(){
    if(S.failed) return true;
    if(!S.loaded) return false;   // still connecting is not the same as stale
    if(!S.generated) return true;
    var d=new Date(S.generated);
    return isNaN(d.getTime())||(Date.now()-d.getTime())>STALE_MS;
  }

  /* ── The book (MY BOOK's watchlist) ──────────────────────────────────────
   * The 07-30 trap was two watchlists in one page: news-desk persisted to
   * nd-prefs-v1 while regime-desk keeps rd-watchlist, and MY BOOK read the
   * empty one and showed 0 forever. Resolution order, most specific first:
   *   1. a book uploaded or pasted HERE          (rd-news-book, persisted)
   *   2. a book left behind by the ported tab    (nd-prefs-v1, migrated once)
   *   3. regime-desk's own watchlist             (rd-watchlist, session seed)
   *   4. the watchlist baked into the snapshot   (session seed)
   * Seeds (3,4) are never written back, so "clear book" clears an uploaded
   * list rather than fighting a value that silently reappears — and a cleared
   * book stays cleared, which is why `cleared` is persisted. */
  function loadBook(){
    try{
      var raw=localStorage.getItem(BOOK_KEY);
      if(raw){
        var p=JSON.parse(raw);
        if(p&&Array.isArray(p.tickers)&&p.tickers.length){
          S.book=p.tickers.map(up); S.bookLabel=p.label||null; return;
        }
        if(p&&p.cleared) return;
      }
    }catch(e){}
    try{
      var nd=JSON.parse(localStorage.getItem('nd-prefs-v1')||'null');
      if(nd&&Array.isArray(nd.watchlist)&&nd.watchlist.length){
        S.book=nd.watchlist.map(up);
        S.bookLabel=(nd.holdingsSummary&&nd.holdingsSummary.filename)||'carried over from the previous news tab';
        saveBook(); return;
      }
    }catch(e){}
    try{
      var w=(localStorage.getItem('rd-watchlist')||'').split(',').map(up).filter(Boolean);
      if(w.length){
        S.book=w; S.bookLabel='regime-desk watchlist'; S.bookSeeded=true; return;
      }
    }catch(e){}
    var sw=(window.SNAPSHOT||{}).watchlist;
    if(Array.isArray(sw)&&sw.length){
      S.book=sw.map(up); S.bookLabel="this build's watchlist"; S.bookSeeded=true;
    }
  }
  function saveBook(){
    try{
      localStorage.setItem(BOOK_KEY,JSON.stringify({
        tickers:S.book, label:S.bookLabel, cleared:!S.book.length
      }));
    }catch(e){}
  }
  function inBook(t){ return S.book.indexOf(t)>=0; }

  /* ── Shell ─────────────────────────────────────────────────────────────
   * Rendered once by the router. Only #nd-feed and #nd-chips are ever
   * rewritten afterwards — never the .card itself, because the page's pop-out
   * observer appends a .popout-btn to every card and replacing the card's
   * innerHTML would delete it on every poll. */
  function shell(){
    return ''
    +'<div class="card">'
      +'<h2>News feed</h2>'
      +'<div class="nd-top">'
        +'<button type="button" class="nd-tab on" data-act="tab" data-tab="news">News <span class="n" id="nd-n-news">—</span></button>'
        +'<button type="button" class="nd-tab" data-act="tab" data-tab="book">My book <span class="n" id="nd-n-book">—</span></button>'
        +'<span class="nd-live"><span class="nd-dot" id="nd-dot"></span><span id="nd-updated">connecting…</span></span>'
      +'</div>'
      +'<div class="nd-bar">'
        +'<span class="nd-lbl">Search</span>'
        +'<input type="text" id="nd-q" placeholder="headline / ticker / source" autocomplete="off">'
        +'<span class="nd-lbl">Source</span>'
        +'<select id="nd-src"><option value="">All</option></select>'
        +'<span class="nd-lbl">Type</span>'
        +'<select id="nd-typ"><option value="">All</option></select>'
        +'<button type="button" class="nd-btn" data-act="clr">Clear</button>'
        +'<span class="nd-count" id="nd-counts">—</span>'
      +'</div>'
      +'<div class="nd-chips" id="nd-chips"></div>'
    +'</div>'
    +'<div class="card"><div class="nd-feed" id="nd-feed">'
      +'<div class="nd-empty"><h3>Loading</h3><div>Fetching headlines from news-desk.</div></div>'
    +'</div></div>'
    +'<footer>Headlines from news-desk, refetched every minute; it republishes every five. '
    +'Price and session change come from this page\u2019s latest daily scan where it covers the ticker, and otherwise from news-desk\u2019s quote file, refreshed every few minutes (hover a price to see which). '
    +'A symbol shown on its own is one neither source prices. Not investment advice.</footer>';
  }

  /* ── Rows ───────────────────────────────────────────────────────────── */
  function tickerCell(tks){
    var p=priceMap(),out='',first=tks[0],d=p[first];
    out+='<div class="nd-tk"><span class="nd-sym" data-ticker="'+esc(first)+'" data-tk="'+esc(first)+'">'+esc(first)+'</span>';
    if(d){
      out+='<span class="nd-px" title="'+(d.src==='news-desk'
        ? 'From news-desk\u2019s quote file, refreshed every few minutes'
        : 'From this page\u2019s latest daily scan: last close over previous close')+'">$'+d.price.toFixed(2)+'</span>';
      if(d.chg!=null) out+=chgHTML(d.chg,2);
    }
    out+='</div>';
    var rest=tks.slice(1);
    if(rest.length){
      out+='<div class="nd-more">'+rest.map(function(t){
        var q=p[t];
        return '<span data-ticker="'+esc(t)+'" data-tk="'+esc(t)+'">'+esc(t)
          +(q&&q.chg!=null
            ? ' <b style="color:'+(q.chg>=0?'#3fae6a':'#e5484d')+'">'
              +(q.chg>=0?'+':'')+(q.chg*100).toFixed(1)+'%</b>'
            : '')
          +'</span>';
      }).join('')+'</div>';
    }
    return out;
  }

  function row(h){
    var t=fmtTime(h.published);
    var typ=String(h.type||'news');
    var sent=h.sentiment==='positive'?' pos':(h.sentiment==='negative'?' neg':'');
    var link=String(h.link||'');
    var key=link||String(h.title||'');
    // Only http(s) links become anchors — a feed is external input, and
    // javascript: in an href would be an injection.
    var safe=/^https?:\/\//i.test(link);
    var title=esc(h.title||'(untitled)');
    return '<div class="nd-row'+sent+(S.open[key]?' open':'')+'" data-key="'+esc(key)+'">'
      +'<div class="nd-time">'+esc(t.hh)+'<i>'+esc(t.rel)+'</i></div>'
      +'<div class="nd-tks">'+tickerCell(h.tickers)+'</div>'
      +'<div class="nd-hl">'
        +(safe?'<a href="'+esc(link)+'" target="_blank" rel="noopener noreferrer">'+title+'</a>':'<span style="color:#f2f2f2;font-size:13px">'+title+'</span>')
        +(h.summary?'<div class="nd-sum">'+esc(h.summary)+'</div>':'')
      +'</div>'
      +'<div class="nd-typcell"><span class="nd-typ t-'+esc(typ.replace(/[^a-z0-9]/gi,''))+'">'+esc(typ)+'</span></div>'
      +'<div class="nd-src">'+esc(h.source||'')+'</div>'
    +'</div>';
  }

  function stream(list){
    if(!list.length) return '';
    var out='',grp=null;
    list.forEach(function(h){
      var g=groupKey(h.published);
      if(g!==grp){ grp=g; out+='<div class="nd-grp">'+esc(g)+'</div>'; }
      out+=row(h);
    });
    return out;
  }

  function empty(title,body,bad){
    return '<div class="nd-empty'+(bad?' bad':'')+'"><h3>'+esc(title)+'</h3><div>'+body+'</div></div>';
  }

  /* ── Filtering ───────────────────────────────────────────────────────────
   * Untagged headlines are dropped, same as the previous tab: this view is a
   * ticker feed, and anything news-desk could not confidently tag has no row
   * to sit in. */
  function tagged(){
    return S.headlines.filter(function(h){ return h.tickers&&h.tickers.length; });
  }
  function filtered(){
    var q=S.q.trim().toLowerCase();
    return tagged().filter(function(h){
      if(S.src&&h.source!==S.src) return false;
      if(S.typ&&h.type!==S.typ) return false;
      if(S.ticker&&h.tickers.indexOf(S.ticker)<0) return false;
      if(S.tab==='book'&&!h.tickers.some(inBook)) return false;
      if(q){
        var hay=((h.title||'')+' '+(h.summary||'')+' '+h.tickers.join(' ')+' '+(h.source||'')).toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
      return true;
    });
  }

  /* ── Render ─────────────────────────────────────────────────────────── */
  function renderChips(){
    var el=$('nd-chips'); if(!el) return;
    var out='';
    if(S.ticker) out+='<button type="button" class="rd-chip" data-act="unpick">'+esc(S.ticker)+' ✕</button>';
    el.innerHTML=out;
  }

  function bookHeader(){
    return '<div class="nd-bookhead">'
      +'<span><b>'+S.book.length+'</b> ticker'+(S.book.length===1?'':'s')
      +(S.bookLabel?' · '+esc(S.bookLabel):'')+(S.bookSeeded?' (seeded — upload or paste to replace)':'')+'</span>'
      +'<button type="button" class="nd-btn" data-act="bookedit">Replace book</button>'
      +'<button type="button" class="nd-btn" data-act="bookclear">Clear book</button>'
    +'</div>';
  }

  function bookPanel(){
    return '<div class="nd-book">'
      +'<p>MY BOOK filters the feed to names you hold. Drop a holdings spreadsheet — an LPL '
      +'<code>Account-Investments-*.xlsx</code> or any file with a Symbol column — or paste tickers below. '
      +'The file is parsed in your browser; nothing leaves your machine.</p>'
      +'<label class="nd-drop" id="nd-drop">'
        +'<div class="big">Drop .xlsx or .csv here, or click to choose</div>'
        +'<div class="sml">Looks for a Symbol / Ticker / Security ID / CUSIP column</div>'
        +'<input type="file" id="nd-file" accept=".xlsx,.xls,.csv">'
      +'</label>'
      +'<p>Or paste tickers, separated by commas, spaces or newlines:</p>'
      +'<textarea class="nd-paste" id="nd-paste" rows="3" placeholder="AAPL MSFT NVDA GOOGL META TSLA AMZN"></textarea>'
      +'<div class="nd-acts"><button type="button" class="nd-btn" data-act="paste">Load these tickers</button></div>'
      +(S.bookMsg?'<div class="nd-msg'+(S.bookMsg.bad?' bad':'')+'">'+S.bookMsg.html+'</div>':'')
    +'</div>';
  }

  function render(){
    var all=tagged();
    setText('nd-n-news',String(all.length));
    setText('nd-n-book',String(S.book.length
      ? all.filter(function(h){ return h.tickers.some(inBook); }).length
      : 0));
    setText('nd-updated',fmtUpdated());
    var dot=$('nd-dot');
    if(dot) dot.className='nd-dot'+(stale()?' stale':'');
    renderChips();

    var feed=$('nd-feed'); if(!feed) return;

    if(S.tab==='book'&&!S.book.length){
      setText('nd-counts','no book loaded');
      feed.innerHTML=bookPanel();
      return;
    }
    if(!S.loaded&&!S.failed){
      setText('nd-counts','—');
      feed.innerHTML=empty('Loading','Fetching headlines from news-desk.');
      return;
    }
    if(!S.headlines.length){
      setText('nd-counts','0 headlines');
      feed.innerHTML=empty('Feed unreachable',
        'Could not load headlines from news-desk. It publishes at '
        +'<a href="https://helioskozak-cloud.github.io/news-desk/" target="_blank" rel="noopener noreferrer">news-desk</a>'
        +' — if that page is up, this is a fetch problem here and a reload should fix it.',true);
      return;
    }

    var list=filtered();
    setText('nd-counts',list.length+' / '+all.length+' shown');
    var head=(S.tab==='book'?bookHeader():'');
    feed.innerHTML=head+(list.length
      ? stream(list)
      : empty('Nothing matches',
          S.tab==='book'
            ? 'No headlines mention a name in your book right now. The feed refreshes every five minutes.'
            : 'No headlines match these filters. Clear them to see the whole feed.'));
  }

  /* ── Loading ────────────────────────────────────────────────────────────
   * headlines.json is the feed. stocks.json is fetched for company names
   * only — see the units note at the top of this section. */
  function load(){
    var t=Date.now();
    var head=fetch('https://helioskozak-cloud.github.io/news-desk/data/headlines.json?_t='+t)
      .then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; });
    var stk=fetch('https://helioskozak-cloud.github.io/news-desk/data/stocks.json?_t='+t)
      .then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; });
    return Promise.all([head,stk]).then(function(res){
      var doc=res[0],stocks=res[1];
      if(stocks&&stocks.stocks){
        S.nd=ndQuotes(stocks);
        S.ndAsOf=stocks.generated||null;
        _px=null;   // rebuilt with the new fallback quotes
        Object.keys(S.nd).forEach(function(k){
          var n=S.nd[k].name;
          if(n&&!S.names[k]) S.names[k]=n;
        });
      }
      if(!doc||!Array.isArray(doc.headlines)){
        S.failed=true;
        console.error('news tab: headlines.json did not load or had no headlines array');
        render();
        return;
      }
      S.failed=false; S.loaded=true; S.fetchedAt=Date.now();
      S.headlines=doc.headlines;
      S.generated=doc.generated||null;
      if(doc.ticker_names) Object.keys(doc.ticker_names).forEach(function(k){ S.names[k]=doc.ticker_names[k]; });
      syncSelects();
      render();
    });
  }

  // Rebuilt from the feed, preserving the current choice. A filter whose
  // option vanished is dropped rather than silently filtering everything out.
  function syncSelects(){
    var srcs={},typs={};
    S.headlines.forEach(function(h){
      if(h.source) srcs[h.source]=1;
      if(h.type) typs[h.type]=1;
    });
    S.sources=Object.keys(srcs).sort();
    S.types=Object.keys(typs).sort();
    if(S.src&&S.sources.indexOf(S.src)<0) S.src='';
    if(S.typ&&S.types.indexOf(S.typ)<0) S.typ='';
    var a=$('nd-src');
    if(a) a.innerHTML='<option value="">All</option>'+S.sources.map(function(s){
      return '<option value="'+esc(s)+'"'+(s===S.src?' selected':'')+'>'+esc(s)+'</option>'; }).join('');
    var b=$('nd-typ');
    if(b) b.innerHTML='<option value="">All</option>'+S.types.map(function(s){
      return '<option value="'+esc(s)+'"'+(s===S.typ?' selected':'')+'>'+esc(s.toUpperCase())+'</option>'; }).join('');
  }

  /* ── Holdings ───────────────────────────────────────────────────────────
   * CSV is parsed natively. .xlsx uses SheetJS VENDORED at
   * docs/vendor/xlsx.full.min.js and loaded same-origin and lazily — never a
   * CDN, which is the dependency the self-contained rule exists to remove,
   * and which on 07-30 left every upload (including CSV, which news-desk also
   * routed through XLSX.read) waiting on a library that never arrived. */
  var TICKER_RE=/^[A-Z]{1,5}(?:\.[A-Z]{1,2})?$/;
  var CASH_LIKE={CASH:1,USD:1,MMF:1,SPAXX:1,VMFXX:1,SWVXX:1,FDRXX:1,FZFXX:1,
                 VMRXX:1,SNSXX:1,MM:1,SWEEP:1,BANKDEP:1,INSURED:1,'9999136':1};
  var SYM_HEADERS=['symbol / cusip / id','symbol / cusip','symbol','ticker','security id','cusip'];

  function findSymbolColumn(headers){
    var norm=headers.map(function(h){ return String(h==null?'':h).trim().toLowerCase(); });
    for(var w=0;w<SYM_HEADERS.length;w++){
      for(var i=0;i<norm.length;i++){
        if(norm[i]===SYM_HEADERS[w]||norm[i].indexOf(SYM_HEADERS[w])>=0)
          return {idx:i,label:headers[i]};
      }
    }
    return null;
  }

  // Minimal RFC4180: quoted fields, "" escapes, newlines inside quotes.
  function parseCSV(text){
    if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
    var rows=[],r=[],cur='',q=false;
    for(var i=0;i<text.length;i++){
      var c=text[i];
      if(q){
        if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; }
        else cur+=c;
      }
      else if(c==='"') q=true;
      else if(c===','){ r.push(cur); cur=''; }
      else if(c==='\n'){ r.push(cur); cur=''; rows.push(r); r=[]; }
      else if(c!=='\r') cur+=c;
    }
    if(cur.length||r.length){ r.push(cur); rows.push(r); }
    return rows;
  }

  function loadXLSX(ok,fail){
    if(typeof XLSX!=='undefined') return ok();
    if(loadXLSX._q){ loadXLSX._q.push([ok,fail]); return; }
    loadXLSX._q=[[ok,fail]];
    var s=document.createElement('script');
    s.src='vendor/xlsx.full.min.js';
    s.onload=function(){ var q=loadXLSX._q||[]; loadXLSX._q=null; q.forEach(function(p){ p[0](); }); };
    s.onerror=function(){ var q=loadXLSX._q||[]; loadXLSX._q=null; q.forEach(function(p){ p[1](); }); };
    document.head.appendChild(s);
  }

  function applyRows(rows,name){
    var headerIdx=0;
    for(var i=0;i<Math.min(rows.length,6);i++){
      var non=(rows[i]||[]).filter(function(v){ return String(v==null?'':v).trim().length>0; }).length;
      if(non>=4){ headerIdx=i; break; }
    }
    var headers=rows[headerIdx]||[];
    var body=rows.slice(headerIdx+1);
    var col=findSymbolColumn(headers);
    if(!col){
      S.bookMsg={bad:true,html:'<b>'+esc(name)+'</b> — no Symbol-like column found in the first sheet. '
        +'Expected one of: Symbol, Ticker, Security ID, CUSIP.'};
      render(); return;
    }
    var seen={},order=[],skipped=0;
    body.forEach(function(rw){
      var tk=up(rw[col.idx]).replace(/\s+/g,'');
      if(!tk) return;
      if(CASH_LIKE[tk]){ skipped++; return; }
      if(!TICKER_RE.test(tk)){ skipped++; return; }
      if(!seen[tk]){ seen[tk]=1; order.push(tk); }
    });
    if(!order.length){
      S.bookMsg={bad:true,html:'<b>'+esc(name)+'</b> — read the <b>'+esc(String(col.label))+'</b> column but found no usable tickers in '
        +body.length+' rows.'};
      render(); return;
    }
    S.book=order.sort();
    S.bookLabel=name; S.bookSeeded=false;
    S.bookMsg={bad:false,html:'<b>'+esc(name)+'</b> — '+S.book.length+' tickers from the <b>'
      +esc(String(col.label))+'</b> column of '+body.length+' rows'
      +(skipped?', '+skipped+' cash/non-ticker rows skipped':'')+'.'};
    saveBook();
    render();
  }

  function readHoldings(file){
    if(!file) return;
    var reader=new FileReader();
    if(/\.(xlsx|xlsm|xlsb|xls)$/i.test(file.name||'')){
      loadXLSX(function(){
        reader.onload=function(ev){
          try{
            var wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
            applyRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],
              {header:1,raw:true,defval:''}),file.name);
          }catch(err){
            S.bookMsg={bad:true,html:'Could not read that spreadsheet: '+esc(String(err))};
            render();
          }
        };
        reader.readAsArrayBuffer(file);
      },function(){
        S.bookMsg={bad:true,html:'Could not load the spreadsheet reader. Reload the page, or save the file as CSV — CSV needs no reader.'};
        render();
      });
      return;
    }
    reader.onload=function(ev){
      try{ applyRows(parseCSV(String(ev.target.result)),file.name); }
      catch(err){
        S.bookMsg={bad:true,html:'Could not read that file: '+esc(String(err))};
        render();
      }
    };
    reader.readAsText(file);
  }

  function pasteBook(){
    var ta=$('nd-paste');
    var raw=ta?ta.value:'';
    var tks=String(raw||'').split(/[\s,;]+/)
      .map(function(s){ return up(s).replace(/[^A-Z0-9.]/g,''); })
      .filter(function(s){ return s&&TICKER_RE.test(s); });
    if(!tks.length){
      S.bookMsg={bad:true,html:'No valid tickers in that text. Symbols look like <b>AAPL</b> or <b>BRK.B</b>.'};
      render(); return;
    }
    var uniq=[];
    tks.forEach(function(t){ if(uniq.indexOf(t)<0) uniq.push(t); });
    S.book=uniq.sort();
    S.bookLabel='pasted'; S.bookSeeded=false;
    S.bookMsg={bad:false,html:'<b>'+S.book.length+'</b> tickers loaded.'};
    saveBook();
    render();
  }

  /* ── Events ─────────────────────────────────────────────────────────────
   * One delegated listener per event type on #v-news. Nothing is bound by an
   * inline attribute and nothing is re-exposed on window, so there is no way
   * for a control to render fine and do nothing — the 07-30 failure. */
  function setTab(t){
    S.tab=t; S.ticker=null; S.bookMsg=null;
    var root=$('v-news'); if(!root) return;
    Array.prototype.forEach.call(root.querySelectorAll('.nd-tab'),function(b){
      b.classList.toggle('on',b.getAttribute('data-tab')===t);
    });
    render();
  }
  function pick(t){
    S.ticker=(S.ticker===t?null:t);
    render();
  }
  function clearFilters(){
    S.q=''; S.src=''; S.typ=''; S.ticker=null;
    var q=$('nd-q'); if(q) q.value='';
    var a=$('nd-src'); if(a) a.value='';
    var b=$('nd-typ'); if(b) b.value='';
    render();
  }

  function onClick(e){
    var t=e.target;
    if(t.closest&&t.closest('a')) return;              // links stay links
    var act=t.closest?t.closest('[data-act]'):null;
    if(act){
      var a=act.getAttribute('data-act');
      if(a==='tab'){ setTab(act.getAttribute('data-tab')); return; }
      if(a==='clr'){ clearFilters(); return; }
      if(a==='unpick'){ S.ticker=null; render(); return; }
      if(a==='paste'){ pasteBook(); return; }
      if(a==='bookclear'||a==='bookedit'){
        // "Clear book" is a decision and is remembered; "Replace book" only
        // opens the upload panel, so backing out of it restores the seed on
        // the next load instead of silently discarding it.
        var wasSeed=S.bookSeeded;
        S.book=[]; S.bookLabel=null; S.bookSeeded=false; S.bookMsg=null;
        if(a==='bookclear'||!wasSeed) saveBook();
        render(); return;
      }
      return;
    }
    // Modified clicks belong to the page-wide [data-ticker] handlers
    // (shift → open news-desk, alt → copy symbol). Don't steal them.
    if(e.shiftKey||e.metaKey||e.ctrlKey||e.altKey) return;
    var tk=t.closest?t.closest('[data-tk]'):null;
    if(tk){ pick(tk.getAttribute('data-tk')); return; }
    var row=t.closest?t.closest('.nd-row'):null;
    if(row){
      var k=row.getAttribute('data-key');
      if(S.open[k]) delete S.open[k]; else S.open[k]=1;
      row.classList.toggle('open');
    }
  }

  function onInput(e){
    if(e.target&&e.target.id==='nd-q'){ S.q=e.target.value; render(); }
  }
  function onChange(e){
    var el=e.target; if(!el) return;
    if(el.id==='nd-src'){ S.src=el.value; render(); return; }
    if(el.id==='nd-typ'){ S.typ=el.value; render(); return; }
    if(el.id==='nd-file'){ if(el.files&&el.files[0]) readHoldings(el.files[0]); return; }
  }
  function onDragOver(e){
    var d=e.target.closest?e.target.closest('#nd-drop'):null;
    if(!d) return;
    e.preventDefault(); d.classList.add('over');
  }
  function onDragLeave(e){
    var d=e.target.closest?e.target.closest('#nd-drop'):null;
    if(d) d.classList.remove('over');
  }
  function onDrop(e){
    var d=e.target.closest?e.target.closest('#nd-drop'):null;
    if(!d) return;
    e.preventDefault(); d.classList.remove('over');
    var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    if(f) readHoldings(f);
  }

  function boot(){
    if(S.booted) return;
    var root=$('v-news');
    if(!root){ console.error('news tab: #v-news is missing, cannot boot'); return; }
    S.booted=true;
    loadBook();
    root.addEventListener('click',onClick);
    root.addEventListener('input',onInput);
    root.addEventListener('change',onChange);
    root.addEventListener('dragover',onDragOver);
    root.addEventListener('dragenter',onDragOver);
    root.addEventListener('dragleave',onDragLeave);
    root.addEventListener('drop',onDrop);
    render();
    load();
    S.timer=setInterval(load,POLL_MS);
    setInterval(function(){
      setText('nd-updated',fmtUpdated());
      var dot=$('nd-dot'); if(dot) dot.className='nd-dot'+(stale()?' stale':'');
    },15000);
  }

  return {shell:shell,boot:boot,render:render,load:load,state:S,priceMap:priceMap,
          _parseCSV:parseCSV,_applyRows:applyRows,_fmtTime:fmtTime,_groupKey:groupKey};
})();

function route(){
  const hash=(location.hash||"#home").replace("#","");
  const view=VIEWS.includes(hash)?hash:"home";
  VIEWS.forEach(v=>{
    document.getElementById("v-"+v).classList.toggle("active",v===view);
    const a=document.getElementById("nav-"+v);
    if(a)a.classList.toggle("active",v===view);
  });
  const el=document.getElementById("v-"+view);
  if(!el.dataset.rendered){el.innerHTML=renderers[view]();el.dataset.rendered="1";if(typeof window['_rd_postrender_'+view]==='function')window['_rd_postrender_'+view]();}
}

// ── Pop-out: any card (with its charts/tables) opens enlarged in a modal ──────
(function(){
  const ov=document.createElement('div');ov.id='popout-ov';
  ov.innerHTML='<div id="popout-box"><button id="popout-x" type="button">✕ Esc</button><div id="popout-body"></div></div>';
  document.body.appendChild(ov);
  const body=ov.querySelector('#popout-body');
  const close=()=>{ov.style.display='none';body.innerHTML='';};
  ov.addEventListener('click',e=>{if(e.target===ov)close();});
  ov.querySelector('#popout-x').addEventListener('click',close);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ov.style.display==='flex')close();});
  const main=document.getElementById('main')||document.body;
  function inject(){
    main.querySelectorAll('.card').forEach(card=>{
      if(card.querySelector(':scope>.popout-btn'))return;
      const b=document.createElement('button');b.className='popout-btn';b.type='button';b.title='Pop out';b.textContent='⤢';
      b.addEventListener('click',ev=>{ev.stopPropagation();ev.preventDefault();
        const clone=card.cloneNode(true);
        clone.querySelectorAll('.popout-btn').forEach(x=>x.remove());
        clone.style.margin='0';clone.style.border='none';clone.style.background='transparent';clone.style.padding='0';
        body.innerHTML='';body.appendChild(clone);ov.style.display='flex';ov.scrollTop=0;
      });
      card.appendChild(b);
    });
  }
  const obs=new MutationObserver(()=>{obs.disconnect();inject();obs.observe(main,{childList:true,subtree:true});});
  inject();obs.observe(main,{childList:true,subtree:true});
})();

function _qRegime(){

  var ret20=hist.map(function(d){return d.ret_20d||0;});

  var streakTxt=spy.regime_streak?spy.regime_streak+'-day streak':'';
  var interp={'Bull Trend':'Momentum tends to persist. Sector leaders typically outperform; breadth is key.','Correction':'Caution warranted — downside risk elevated, though recoveries can be swift.','Deep Correction':'Significant drawdown underway. High volatility likely before stabilization.','Recovery':'Risk assets historically favored as breadth improves from a low.','High Volatility':'Position sizing and risk management are the priority right now.','Pullback':'Short-term pullback within a broader trend — often a re-entry opportunity.','Neutral':'No strong directional signal. Sector selection matters more than macro exposure.'};
  var chartHtml=ret20.length>1?svgLineChart(ret20,420,90,'SPY rolling 20-day return — last 20 sessions'):'';

    +'<tr><td style="color:#8f8f8f;font-size:12px;padding:5px 0">SPY 20-day</td><td style="text-align:right;color:'+ec20+';font-weight:600">'+pct(spy.ret_20d)+'</td></tr>'
    +'<tr><td style="color:#8f8f8f;font-size:12px;padding:5px 0">Realized vol</td><td style="text-align:right;font-weight:600">'+((spy.vol_20d||0)*100).toFixed(2)+'%/day</td></tr>'

function _qRisk(){

  var scCol=sc>=0.65?'#e5484d':sc>=0.45?'#d4a72c':'#3fae6a';

    +'<div class="grid2" style="margin-bottom:14px">'
    +'<div><div style="font-size:52px;font-weight:700;color:'+scCol+';line-height:1">'+(sc*100).toFixed(0)+'<span style="font-size:18px">/100</span></div>'
    +'<div style="color:#8f8f8f;font-size:13px;margin:4px 0 12px">'+scLabel+'</div>'
    +'<div style="font-size:12px;color:#8f8f8f">Avg p10 across signals: <strong style="color:#e5484d">'+pct(avgAdv)+'</strong></div>'
    +'<div style="font-size:12px;color:#8f8f8f;margin-top:4px">Reversal risk: <strong>'+((S.spy.reversal_risk||0)*100).toFixed(0)+'%</strong></div>'

function _qHighConf(){

function _qHorizon(q){

  if(/\b5d?\b|5.day/.test(ql))h='5d';

  else if(/\b120d?\b|120.day|long/.test(ql))h='120d';
  return _qTopStocks('Top Signals — '+h+' Horizon','Stocks with '+h+' horizon, ranked by edge',
    function(s){return s.horizon===h;},null,12);
}

    +'<div><div style="color:#6f6f6f;font-size:11px">Top Sectors</div><div style="font-size:13px;color:#c9c9c9;max-width:200px">'+topSec+'</div></div>'

    +'</div>'
    +_qChips(['What\'s the market regime?','Top stocks by edge','Show risk profile','Historical analogs','Client meeting summary','What sectors lead?'])
    +'</div>';
}

// ── dispatcher ────────────────────────────────────────────────────────────────
function _rdQueryEngine(q){
  var ql=q.toLowerCase().trim();
  // 1. Ticker detection — exact word match against S.stocks
  var words=q.toUpperCase().replace(/[^A-Z0-9 ]/g,' ').split(/\s+/);
  var tkList=S.stocks.map(function(s){return s.ticker;});
  for(var wi=0;wi<words.length;wi++){if(words[wi].length>=1&&tkList.indexOf(words[wi])!==-1){return _qTicker(words[wi]);}}
  // 2. Sector name match
  var knownSectors=S.sectors.filter(function(s){return s.name&&s.name!=='Unknown';});
  for(var si=0;si<knownSectors.length;si++){
    var sn=knownSectors[si].name.toLowerCase();
    if(ql.indexOf(sn)!==-1){
      if(/all sector|list sector|show sector|every sector|compare sector/.test(ql))return _qAllSectors();
      return _qSector(knownSectors[si].name);
    }
  }
  // 3. Keyword intents
  if(/regime|market condition|bull.?market|bear.?market|phase|current market|how is.*market|what.*market/.test(ql))return _qRegime();
  if(/all sector|list sector|show sector|every sector|compare sector|sector overview|which sector/.test(ql))return _qAllSectors();
  if(/defens|safe stock|conserv|low.?risk stock|stable stock|healthcare|utilities|staple/.test(ql))return _qDefensive();
  if(/bearish|avoid|worst stock|underperform|negative edge|short|sell/.test(ql))return _qBearish();
  if(/high.?conf|reliable|conviction|consistent|most certain|best signal/.test(ql))return _qHighConf();
  if(/\b5d\b|5.day|\b60d\b|60.day|\b120d\b|120.day|horizon|short.term|medium.term|long.term/.test(ql))return _qHorizon(q);
  if(/risk|downside|danger|threat|worry|concern|adverse|tail|elevat|drawdown/.test(ql))return _qRisk();
  if(/analog|histor|similar|precedent|past|before|comparable|period/.test(ql))return _qAnalog();
  if(/signal|cross.asset|bond|treasury|vix|gold|dollar|oil|credit|copper|nasdaq|russell/.test(ql))return _qSignals();
  if(/summary|brief|overview|plain|explain|tldr|bottom.line|thesis|client|meeting|simple|tell me/.test(ql))return _qNarrative();
  if(/top|best|strongest|highest|leading|good pick|what.?should|buy|long|pick/.test(ql))return _qTopStocks();
  return _qFallback(q);
}

// ── Question log (daily wishlist) ─────────────────────────────────────────────
var RD_LOG_KEY='rd-question-log';
function _rdSaveQuestion(q){
  var log=[];
  try{log=JSON.parse(localStorage.getItem(RD_LOG_KEY)||'[]');}catch(e){}
  var now=new Date(),date=now.toISOString().slice(0,10);
  log.push({q:q,ts:now.toISOString().slice(11,16),date:date});
  if(log.length>500)log=log.slice(-500);
  try{localStorage.setItem(RD_LOG_KEY,JSON.stringify(log));}catch(e){}
}
function _rdLoadLog(){
  try{return JSON.parse(localStorage.getItem(RD_LOG_KEY)||'[]');}catch(e){return[];}
}
window._rdClearDay=function(date){
  var log=_rdLoadLog().filter(function(e){return e.date!==date;});
  try{localStorage.setItem(RD_LOG_KEY,JSON.stringify(log));}catch(e){}
  _rdRenderWishlist();
};
window._rdClearAll=function(){
  try{localStorage.removeItem(RD_LOG_KEY);}catch(e){}
  _rdRenderWishlist();
};
window._rdExportLog=function(){
  var log=_rdLoadLog();
  if(!log.length){alert('No questions logged yet.');return;}
  var byDate={};
  log.forEach(function(e){if(!byDate[e.date])byDate[e.date]=[];byDate[e.date].push(e);});
  var lines=['# Regime Desk — Daily Question Log\n'];
  Object.keys(byDate).sort().reverse().forEach(function(d){
    lines.push('## '+d);
    byDate[d].forEach(function(e){lines.push('- '+(e.ts?'['+e.ts+'] ':'')+e.q);});
    lines.push('');
  });
  var text=lines.join('\n');
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){
      var btn=document.getElementById('rd-export-btn');
      if(btn){btn.textContent='Copied!';setTimeout(function(){btn.textContent='Copy Log';},2000);}
    });
  }else{prompt('Copy this log:',text);}
};
window._rdDownloadLog=function(){
  var log=_rdLoadLog();
  if(!log.length){alert('No questions logged yet.');return;}
  var json=JSON.stringify(log,null,2);
  var a=document.createElement('a');
  a.href='data:application/json;charset=utf-8,'+encodeURIComponent(json);
  a.download='question_log.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
};
function _rdRenderWishlist(){
  var el=document.getElementById('rd-wishlist-body');if(!el)return;
  var log=_rdLoadLog();
  if(!log.length){
    el.innerHTML='<div style="color:#6f6f6f;padding:10px 0;font-size:13px">No questions logged yet — ask something above to start building your daily log.</div>';
    return;
  }
  var byDate={};
  log.forEach(function(e){if(!byDate[e.date])byDate[e.date]=[];byDate[e.date].push(e);});
  var today=new Date().toISOString().slice(0,10);
  var html='';
  Object.keys(byDate).sort().reverse().forEach(function(d){
    var entries=byDate[d];
    var isToday=d===today;
    var label=isToday?'Today — '+d:d;
    var count=entries.length;
    html+='<div style="margin-bottom:18px">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">'
      +'<span style="font-size:12px;font-weight:600;color:'+(isToday?'#5b9dff':'#8f8f8f')+'">'+label
        +'<span style="color:#6f6f6f;font-weight:400;margin-left:6px">'+count+' question'+(count===1?'':'s')+'</span></span>'
      +'<button onclick="window._rdClearDay(\''+d+'\')" style="background:none;border:1px solid #2e2e2e;color:#6f6f6f;border-radius:4px;padding:1px 8px;cursor:pointer;font-size:11px">Clear day</button>'
      +'</div>'
      +entries.map(function(e){
        return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #141414">'
          +(e.ts?'<span style="color:#6f6f6f;font-size:11px;min-width:38px">'+e.ts+'</span>':'')
          +'<span style="flex:1;color:#c9c9c9;font-size:13px;cursor:pointer" '
          +'onclick="window._rdAsk(\''+e.q.replace(/'/g,'').replace(/"/g,'')+'\')" '
          +'onmouseover="this.style.color=\'#5b9dff\'" onmouseout="this.style.color=\'#c9c9c9\'">'+e.q+'</span>'
          +'</div>';
      }).join('')
      +'</div>';
  });
  el.innerHTML=html;
}

// ── Ticker hover tooltip ──────────────────────────────────────────────────────
(function(){
  var tip=document.getElementById('rd-tip');
  if(!tip){tip=document.createElement('div');tip.id='rd-tip';document.body.appendChild(tip);}
  tip.style.display='none';
  var _cx=0,_cy=0;

  function _spark(closes){
    if(!closes||closes.length<2)return '';
    var mn=Math.min.apply(null,closes),mx=Math.max.apply(null,closes);
    var rng=mx-mn||1,W=238,H=30,n=closes.length;
    var pts=closes.map(function(v,i){
      return ((i/(n-1))*W).toFixed(1)+','+(H-2-((v-mn)/rng)*(H-6)).toFixed(1);
    }).join(' ');
    var col=closes[closes.length-1]>=closes[0]?'#3fae6a':'#e5484d';
    return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="display:block;margin-top:5px;overflow:visible">'
      +'<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'
      +'</svg>';
  }

  function pos(cx,cy){
    var tw=tip.offsetWidth||260,th=tip.offsetHeight||180;
    var lx=cx+14,ly=cy+14;
    if(lx+tw>window.innerWidth-8)lx=cx-tw-14;
    if(ly+th>window.innerHeight-8)ly=cy-th-14;
    tip.style.left=lx+'px';tip.style.top=ly+'px';
  }

  function show(ticker,cx,cy){
    _cx=cx;_cy=cy;
    var st=(S.stocks||[]).find(function(s){return s.ticker===ticker;})
        ||(S.all_signals||[]).find(function(s){return s.ticker===ticker;});
    if(!st)return;
    var ec=st.edge>=0?'#3fae6a':'#e5484d';
    var sec=st.sector&&st.sector!=='Unknown'?st.sector:'—';
    var nameRow=st.name&&st.name!==st.ticker
      ?'<div style="color:#8f8f8f;font-size:11px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+st.name+'</div>':'';

    var priceBlock='';
    if(st.price!=null&&st.week_closes&&st.week_closes.length>=2){
      var pc=st.change_pct>=0?'#3fae6a':'#e5484d';
      var ps=st.change_pct>=0?'+':'';
      var wkLo=Math.min.apply(null,st.week_closes),wkHi=Math.max.apply(null,st.week_closes);
      var wkRng=wkHi-wkLo||1;
      var wkPos=Math.max(0,Math.min(100,((st.price-wkLo)/wkRng)*100));
      var rangeBar='<div style="margin-top:5px">'
        +'<div style="display:flex;justify-content:space-between;color:#6f6f6f;font-size:9px;margin-bottom:2px"><span>$'+wkLo.toFixed(2)+'</span><span style="color:#4a4a4a">7d range</span><span>$'+wkHi.toFixed(2)+'</span></div>'
        +'<div style="position:relative;height:4px;background:#141414;border-radius:4px"><div style="position:absolute;left:'+wkPos.toFixed(0)+'%;top:-2px;width:2px;height:8px;background:'+pc+';transform:translateX(-1px);border-radius:1px"></div></div>'
        +'</div>';
      priceBlock='<div style="border-top:1px solid #141414;border-bottom:1px solid #141414;margin:6px 0;padding:4px 0">'
        +'<div style="display:flex;align-items:baseline;gap:8px">'
        +'<span style="color:#f2f2f2;font-size:15px;font-weight:700">$'+st.price.toFixed(2)+'</span>'
        +'<span style="color:'+pc+';font-size:12px;font-weight:600">'+ps+(st.change_pct*100).toFixed(2)+'%</span>'
        +'<span style="color:#4a4a4a;font-size:10px">today</span>'
        +'</div>'
        +_spark(st.week_closes)
        +rangeBar
        +'</div>';
    }

    tip.innerHTML=''
      +'<div style="display:flex;align-items:center;gap:7px;margin-bottom:4px">'
      +'<img src="https://assets.parqet.com/logos/symbol/'+ticker+'?format=jpg" width="22" height="22" '
      +'style="border-radius:4px;background:#fff;border:1px solid #2e2e2e;object-fit:contain;flex-shrink:0" '
      +'onerror="this.style.display=\'none\'" loading="lazy">'
      +'<strong style="color:#f2f2f2;font-size:14px">'+ticker+'</strong>'
      +'<span style="color:#6f6f6f;font-size:11px;margin-left:2px">'+sec+'</span>'
      +'</div>'
      +nameRow
      +priceBlock
      +'<div style="display:flex;gap:16px;padding-top:2px">'
      +'<div><div style="color:#6f6f6f;font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">Edge</div>'
      +'<div style="color:'+ec+';font-weight:600;font-size:13px">'+(st.edge>=0?'+':'')+(st.edge*100).toFixed(1)+'%</div></div>'
      +'<div><div style="color:#6f6f6f;font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">Median</div>'
      +'<div style="color:#c9c9c9;font-size:13px">'+(st.p50>=0?'+':'')+(st.p50*100).toFixed(1)+'%</div></div>'
      +'<div><div style="color:#6f6f6f;font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">Window</div>'
      +'<div style="color:#c9c9c9;font-size:13px">'+(st.horizon||'20d')+'</div></div>'
      +'<div><div style="color:#6f6f6f;font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">Hits</div>'
      +'<div style="color:#c9c9c9;font-size:13px">'+((st.hit_rate||0)*100).toFixed(0)+'%</div></div>'
      +'</div>'
      +'<div style="margin-top:8px;padding-top:6px;border-top:1px solid #141414;color:#6f6f6f;font-size:10px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;line-height:1.55">'
      +  '<div style="color:#5b9dff">shift-click → news-desk ↗</div>'
      +'</div>';
    pos(cx,cy);
    tip.style.display='block';
  }

  function hide(){tip.style.display='none';}
  document.addEventListener('mouseover',function(e){
    var el=e.target.closest?e.target.closest('[data-ticker]'):null;
    if(el)show(el.dataset.ticker,e.clientX,e.clientY);
    else hide();
  });
  document.addEventListener('mousemove',function(e){
    _cx=e.clientX;_cy=e.clientY;
    if(tip.style.display==='block')pos(_cx,_cy);
  });
  document.addEventListener('mouseout',function(e){
    var el=e.target.closest?e.target.closest('[data-ticker]'):null;
    if(el&&!el.contains(e.relatedTarget))hide();
  });
  /* shift-click on any [data-ticker] element opens news-desk filtered to it */
  document.addEventListener('click',function(e){
    if(!(e.shiftKey||e.metaKey||e.ctrlKey))return;
    var el=e.target.closest?e.target.closest('[data-ticker]'):null;
    if(!el||!el.dataset.ticker)return;
    e.preventDefault();e.stopPropagation();
    window.open('https://helioskozak-cloud.github.io/news-desk/?ticker='+encodeURIComponent(el.dataset.ticker),
                '_blank','noopener,noreferrer');
  },true);
  /* alt-click on any [data-ticker] copies ticker symbol to clipboard with toast */
  document.addEventListener('click',function(e){
    if(!e.altKey||e.shiftKey||e.metaKey||e.ctrlKey)return;
    var el=e.target.closest?e.target.closest('[data-ticker]'):null;
    if(!el||!el.dataset.ticker)return;
    e.preventDefault();e.stopPropagation();
    var tk=el.dataset.ticker;
    if(navigator.clipboard)navigator.clipboard.writeText(tk);
    var t=document.createElement('div');
    t.textContent='Copied '+tk;
    t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2b7a4b;color:#fff;padding:8px 16px;border-radius:4px;font-size:13px;font-weight:600;z-index:10000;box-shadow:0 4px 12px rgba(0,0,0,.4);pointer-events:none;transition:opacity .3s';
    document.body.appendChild(t);
    setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.remove();},300);},1200);
  },true);
})();
})();

/* Risk-axis explainer: open the panel under a row.
 *
 * Delegated on `document` rather than bound per row, because the Risk Axes card
 * is re-rendered as a string every time the view changes and per-row listeners
 * would be lost with the nodes that carried them.
 *
 * `hidden` rather than style.display: the page's reset carries
 * [hidden]{display:none!important}, and a panel toggled by inline style would
 * be re-shown by any later class change. One row open at a time — this is a
 * comparison card, and three panels open push the other axes off the screen,
 * which is the fault the one-line-per-axis rebuild existed to fix.
 */
(function(){
  function closeAll(except){
    document.querySelectorAll('.rax-why').forEach(function(w){
      if(w!==except) w.hidden=true;
    });
    document.querySelectorAll('[data-why]').forEach(function(r){
      var w=document.getElementById(r.dataset.why);
      r.setAttribute('aria-expanded', w && !w.hidden ? 'true' : 'false');
      var c=r.querySelector('.rax-chev');
      if(c) c.innerHTML = (w && !w.hidden) ? '&#9660;' : '&#9654;';
    });
  }
  function toggle(row){
    var w=document.getElementById(row.dataset.why);
    if(!w) return;
    w.hidden=!w.hidden;
    // closeAll(w) covers both directions: when w is now open it is the one row
    // spared, and when it is now closed sparing it changes nothing because it
    // is already hidden. A mutation replacing a `wasOpen?null:w` ternary here
    // changed no behaviour at all, which is how the branch was found to be dead.
    closeAll(w);
  }
  document.addEventListener('click',function(e){
    var row=e.target.closest && e.target.closest('[data-why]');
    if(row) toggle(row);
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter'&&e.key!==' ') return;
    var row=e.target.closest && e.target.closest('[data-why]');
    if(!row) return;
    e.preventDefault();
    toggle(row);
  });
})();
</script>
