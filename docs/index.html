<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regime Desk</title>
<!-- Favicon: rising market bars, blue. Inline SVG data URI — no request, and
     nothing to 404 on GitHub Pages. Kept to one bold shape in one colour
     because at 16px in a tab strip that is all you can actually tell apart;
     PAPA is an amber sun, so the two never look alike. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cg fill='%2358a6ff'%3E%3Crect x='5.5' y='18' width='6' height='9' rx='1.5'/%3E%3Crect x='13' y='11' width='6' height='16' rx='1.5'/%3E%3Crect x='20.5' y='5' width='6' height='22' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--sans:'Geist',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:'Geist Mono',ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
body{background:#050505;color:#c9c9c9;font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:#5b9dff;text-decoration:none}
/* The bar stays full-bleed so its background spans the screen, but its
   CONTENTS line up with #main's centred 1760px column — otherwise on a wide
   monitor the nav sits at the far left while the cards start hundreds of
   pixels in, which reads as a broken layout. max() keeps the old 20px on
   anything narrower than the cap. Percentages in padding resolve against the
   body width, so this excludes the scrollbar; 100vw would not. */
#topbar{position:sticky;top:0;z-index:100;background:#0e0e0e;border-bottom:1px solid #2e2e2e;display:flex;align-items:center;gap:16px;padding:0 max(20px,calc((100% - 1760px)/2 + 28px));height:48px}
#topbar h1{font-family:var(--mono);font-size:14px;font-weight:700;color:#f2f2f2;white-space:nowrap;text-transform:uppercase;letter-spacing:1px}
#topbar nav{display:flex;gap:4px;flex-wrap:wrap}
#topbar nav a{font-family:var(--mono);padding:4px 10px;border-radius:4px;color:#8f8f8f;font-size:12px;transition:background .15s}
#topbar nav a:hover,#topbar nav a.active{background:#141414;color:#f2f2f2}
#topbar .ts{margin-left:auto;color:#6f6f6f;font-size:11px;white-space:nowrap}
#regime-banner{background:#0e0e0e;border-bottom:1px solid #2e2e2e;padding:8px max(20px,calc((100% - 1760px)/2 + 28px));display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.regime-label{font-size:13px;font-weight:700;color:#f2f2f2}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.stat .val{font-family:var(--mono);font-size:14px;font-weight:600;color:#f2f2f2;font-variant-numeric:tabular-nums}
.stat .key{font-family:var(--mono);font-size:10px;color:#6f6f6f;text-transform:uppercase;letter-spacing:.5px}
.pill{font-family:var(--mono);padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.pill.bull{background:#1a3a2a;color:#3fae6a}
.pill.bear{background:#3a1a1a;color:#e5484d}
.pill.neut{background:#131d2d;color:#5b9dff}
.pill.elev{background:#3a2a1a;color:#d4a72c}
.pill.mod{background:#131d2d;color:#5b9dff}
.pill.low{background:#1a2a1a;color:#3fae6a}
/* Was capped at 1200px, which wasted most of a wide monitor. 1760px uses the
   width without letting body text run to a line length nobody can track back
   from — the cards inside set their own narrower measures where it matters. */
#main{padding:20px 28px;max-width:1760px;margin:0 auto}
.view{display:none}
.view.active{display:block}
.card{background:#0e0e0e;border:1px solid #2e2e2e;border-radius:4px;padding:13px 14px;margin-bottom:12px;position:relative}
.popout-btn{position:absolute;top:7px;right:7px;z-index:3;width:24px;height:24px;padding:0;line-height:22px;text-align:center;background:#0e0e0e;border:1px solid #2e2e2e;color:#8f8f8f;border-radius:4px;cursor:pointer;font-size:13px;opacity:.45;transition:opacity .12s,border-color .12s,color .12s}
.card:hover>.popout-btn{opacity:.9}
.popout-btn:hover{opacity:1;border-color:#5b9dff;color:#f2f2f2}
#popout-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:1000;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
#popout-box{background:#0e0e0e;border:1px solid #2e2e2e;border-radius:4px;width:min(1200px,96vw);margin:auto;padding:18px 20px;position:relative}
#popout-x{position:absolute;top:10px;right:12px;background:#141414;border:1px solid #2e2e2e;color:#c9c9c9;border-radius:4px;padding:4px 10px;cursor:pointer;font-family:var(--mono);font-size:12px}
#popout-body svg{width:100%!important;height:auto!important;max-height:72vh}
.econ-chart{position:relative}
.chart-fs-btn{position:absolute;top:0;right:0;z-index:2;width:22px;height:22px;padding:0;line-height:20px;text-align:center;background:#0e0e0e;border:1px solid #2e2e2e;color:#8f8f8f;border-radius:4px;cursor:pointer;font-size:12px;opacity:.5;transition:opacity .12s,border-color .12s,color .12s}
.econ-chart:hover .chart-fs-btn{opacity:1}
.chart-fs-btn:hover{border-color:#5b9dff;color:#f2f2f2}
#chartfs-ov{display:none;position:fixed;inset:0;background:#050505;z-index:1300;padding:2vh 2vw;flex-direction:column;align-items:center;justify-content:center}
#chartfs-ov.on{display:flex}
#chartfs-x{position:absolute;top:12px;right:16px;background:#141414;border:1px solid #2e2e2e;color:#c9c9c9;border-radius:4px;padding:6px 12px;cursor:pointer;font-family:var(--mono);font-size:12px}
#chartfs-body{width:100%;text-align:center}
#chartfs-body svg{width:96vw;height:auto;max-height:88vh}
#chartfs-body>.econ-chart>div:first-child{font-size:15px;margin-bottom:14px}
.card h2{font-family:var(--mono);font-size:12px;font-weight:700;color:#f2f2f2;margin-bottom:11px;padding-bottom:7px;border-bottom:1px solid #2e2e2e;text-transform:uppercase;letter-spacing:.8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid-asym{display:grid;grid-template-columns:25fr 75fr;gap:12px}
.tile{background:#0e0e0e;border:1px solid #2e2e2e;border-radius:4px;padding:14px;cursor:pointer;transition:border-color .15s}
.tile:hover{border-color:#5b9dff}
.tile h3{font-family:var(--mono);font-size:12px;font-weight:700;color:#f2f2f2;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.tile .sub{font-size:11px;color:#8f8f8f}
table{width:100%;border-collapse:collapse;font-size:13px;font-family:var(--mono);font-variant-numeric:tabular-nums}
th{text-align:left;padding:6px 8px;color:#8f8f8f;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #2e2e2e}
td{padding:7px 8px;border-bottom:1px solid #141414}
tr:last-child td{border-bottom:none}
tr:hover td{background:#121212}
.bar-wrap{background:#141414;border-radius:1px;height:6px;position:relative;width:80px}
.bar-fill{height:6px;border-radius:1px;background:#2b7a4b;position:absolute;left:0;top:0}
.dist-bar{background:#141414;border-radius:1px;height:10px;position:relative}
.dist-range{position:absolute;height:10px;border-radius:1px}
.dist-med{position:absolute;width:2px;height:10px;background:#f2f2f2}
.score-bar{display:inline-block;width:60px;height:6px;background:#141414;border-radius:1px;vertical-align:middle;position:relative}
.score-fill{height:6px;border-radius:1px;position:absolute;left:0;top:0}
/* ── risk axis meters ────────────────────────────────────────────────────
   One line per axis, and the meter is the point of it. A bare score is a
   scalar with an ambitious name: 0.59 means nothing until you know it is the
   top of where credit stress has been living for three months. So the track
   carries the 90-day range it has occupied, the 30-day range inside that, the
   thresholds where the level changes, and a marker for today.
   Sized so all seven axes plus the summary tiles clear the fold. */
.rax{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid #141414}
.rax:last-of-type{border-bottom:0}
.rax-name{width:158px;flex:0 0 158px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rax-meter{position:relative;flex:1 1 auto;min-width:120px;height:12px;background:#141414;border-radius:4px}
.rax-b90{position:absolute;top:0;height:12px;border-radius:4px;opacity:.22}
.rax-b30{position:absolute;top:0;height:12px;border-radius:4px;opacity:.5}
.rax-tick{position:absolute;top:0;width:1px;height:12px;background:#4a4a4a}
/* TODAY IS WHITE, not the axis colour. Drawn in the same colour as the bands
   it sits inside, the marker vanished exactly where it matters most: an axis
   pinned at the top of its own range. */
.rax-now{position:absolute;top:-3px;width:3px;height:18px;border-radius:1px;background:#f2f2f2;box-shadow:0 0 0 1px #050505}
.rax-rng{flex:0 0 auto;width:96px;text-align:right;font-family:var(--mono);font-size:11px;color:#8f8f8f;white-space:nowrap}
.rax-val{flex:0 0 auto;width:46px;text-align:right;font-family:var(--mono);font-weight:700}
@media(max-width:800px){.rax-rng{display:none}.rax-name{width:118px;flex:0 0 118px}}
.rax{cursor:pointer}
.rd-exp{cursor:pointer;transition:border-color .12s}
.rd-exp:hover{border-color:#6f6f6f!important}
.rd-exp[aria-expanded="true"]{border-color:#5b9dff!important;box-shadow:0 0 0 1px #5b9dff}
.rd-hint{color:#6f6f6f;font-size:9.5px;margin-top:5px;letter-spacing:.3px;text-transform:uppercase}
.rd-exp[aria-expanded="true"] .rd-hint{color:#5b9dff}
.rd-why{border-bottom:0;padding:12px 0 0 0}
.rd-why .rax-why-in{margin-left:0}
.rax-chip.met{border-color:#3fae6a}
.rd-rule{padding:7px 10px;margin:0 0 5px 0;border-radius:4px;border:1px solid #141414;opacity:.62}
.rd-rule.fired{opacity:1;border-color:#5b9dff;background:#050505}
.rd-rule.shadowed{opacity:.9;border-style:dashed}
.rd-rule-n{display:inline-block;width:18px;color:#6f6f6f;font-family:var(--mono);font-size:11px}
.rd-tag{margin-left:8px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:#5b9dff;font-weight:700}
.rd-tag.dim{color:#8f8f8f}
.rd-num{font-family:var(--mono);font-weight:700;color:#f2f2f2}
.rd-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:6px}
html.light .rd-rule{border-color:#eaeef2}
html.light .rd-rule.fired{background:#ffffff;border-color:#0969da}
html.light .rd-num{color:#1f2328}
.rax-chev{flex:0 0 auto;width:14px;text-align:center;color:#6f6f6f;font-size:10px;user-select:none}
.rax[aria-expanded="true"] .rax-chev{color:#f2f2f2}
.rax-why{padding:2px 0 14px 0;border-bottom:1px solid #141414;font-size:12.5px;line-height:1.65;color:#c9c9c9}
.rax-why-in{margin-left:172px;padding:11px 13px;background:#0e0e0e;border-radius:5px;border-left:3px solid #2e2e2e}
.rax-why h4{margin:0 0 5px 0;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#6f6f6f;font-weight:600}
.rax-why p{margin:0 0 11px 0}
.rax-why p:last-child{margin-bottom:0}
.rax-sum{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 11px 0}
.rax-chip{font-family:var(--mono);font-size:11.5px;padding:4px 8px;border-radius:4px;background:#050505;border:1px solid #2e2e2e;white-space:nowrap}
.rax-chip b{font-weight:700}
.rax-chip.past{border-color:#e5484d;color:#ffa198}
.rax-chip.next{border-color:#d4a72c}
@media(max-width:800px){.rax-why-in{margin-left:0}}
html.light .rax-why{border-color:#eaeef2;color:#3a4149}
html.light .rax-why-in{background:#f6f8fa;border-left-color:#d0d7de}
html.light .rax-chip{background:#ffffff;border-color:#d0d7de}
html.light .rax-chip.past{border-color:#cf222e;color:#a40e26}
html.light .rax{border-color:#eaeef2}
html.light .rax-meter{background:#eaeef2}
html.light .rax-tick{background:#afb8c1}
html.light .rax-now{background:#1f2328;box-shadow:0 0 0 1px #ffffff}
footer{text-align:center;padding:20px;color:#4a4a4a;font-size:11px;border-top:1px solid #141414;margin-top:24px}
@media(max-width:640px){.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.grid-asym{grid-template-columns:1fr}}
@media(max-width:800px){
  body{font-size:13px}
  #topbar{padding:10px 14px !important}
  #topbar h1{font-size:16px !important}
  #topbar nav{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;white-space:nowrap;gap:2px !important}
  #topbar nav a{padding:5px 8px !important;font-size:11px !important;flex-shrink:0}
  #regime-banner{flex-wrap:wrap;padding:10px 14px !important;gap:10px !important}
  #regime-banner .stat{flex:0 0 auto;font-size:11px}
  #main{padding:14px 12px !important}
  .card{padding:14px !important;margin-bottom:14px !important}
  .card h2{font-size:15px !important;margin-bottom:10px !important}
  table{font-size:11.5px}
  table th,table td{padding:5px 6px !important}
  /* Stocks tab filter bar wraps cleanly */
  .card div[style*="display:flex"][style*="flex-wrap:wrap"]{gap:5px !important}
  /* Pinned ticker cards in stocks */
  #rd-pinned-cards{margin-bottom:12px}
  /* Ticker hover tooltip — make it not run off screen */
  #rd-tip{min-width:200px !important;max-width:88vw !important;font-size:11px !important}
  /* Treemap-like tile grids stack on phone */
  .tile{padding:10px !important}
}
@media(max-width:480px){
  #topbar h1{font-size:14px !important;letter-spacing:0}
  #topbar h1 span{display:none}
  #regime-banner .stat{font-size:10.5px}
  .card h2{font-size:14px !important}
  table{font-size:11px}
  /* Horizontal scroll for big tables — they already use overflow-x:auto wrappers, but tighten */
  .card div[style*="overflow-x:auto"] table{min-width:560px !important}
}
/* ── Mobile optimization pass (2026-07-27) ──────────────────────────────── */
@media(max-width:640px){
  /* Every data table scrolls within its own width instead of overflowing the
     page. 14 of 24 tables were NOT in an overflow-x wrapper, so wide ones
     pushed the whole layout sideways on a phone. display:block + overflow-x is
     the standard responsive-table pattern (columns stay aligned). */
  #main table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;max-width:100%}
  #main table th,#main table td{white-space:nowrap}
  /* Thumb-friendly tap targets (no hover on touch, so bump the affordances) */
  #topbar nav a{padding:8px 11px !important}
  .rd-chip{display:inline-block;padding:8px 13px !important;margin:4px 3px !important}
  .tile{padding:13px !important}
  /* The chart pop-out / fullscreen buttons rely on :hover to appear — on touch
     there is no hover, so keep them visible and bigger to tap. */
  .popout-btn,.chart-fs-btn{opacity:.8 !important;width:30px !important;height:30px !important;line-height:28px !important}
  .card:hover>.popout-btn{opacity:.8}
  /* Sticky topbar: let it breathe vertically when the nav wraps/scrolls */
  #topbar{height:auto !important;min-height:46px;padding-top:6px !important;padding-bottom:6px !important}
  /* Guard against any single wide inline row (filter/chip bars) shoving the page */
  #main .card > div{max-width:100%}
}
html.light body{background:#ffffff;color:#1f2328}
html.light #topbar,html.light #regime-banner{background:#f6f8fa;border-color:#d0d7de}
html.light #topbar nav a{color:#57606a}
html.light #topbar nav a:hover,html.light #topbar nav a.active{background:#eaeef2;color:#1f2328}
html.light .card{background:#f6f8fa;border-color:#d0d7de}
html.light .tile{background:#f6f8fa;border-color:#d0d7de}
html.light .tile:hover{border-color:#0969da}
html.light td{border-color:#eaeef2}
html.light tr:hover td{background:#eaeef2}
html.light .bar-wrap,.light .dist-bar,.light .score-bar{background:#eaeef2}
html.light .pill.bull{background:#d1fae5;color:#166534}
html.light .pill.bear{background:#fee2e2;color:#991b1b}
html.light .pill.neut{background:#dbeafe;color:#1d4ed8}
html.light .pill.elev{background:#fef3c7;color:#92400e}
html.light .pill.mod{background:#dbeafe;color:#1d4ed8}
html.light .pill.low{background:#d1fae5;color:#166534}
html.light footer{color:#57606a;border-color:#d0d7de}
#rd-tip{position:fixed;z-index:9999;background:#121212;border:1px solid #2e2e2e;border-radius:4px;padding:10px 14px;pointer-events:none;display:none;min-width:220px;max-width:270px;box-shadow:0 8px 32px rgba(0,0,0,.6);font-size:12px;line-height:1.4}
#rd-tip.show{display:block}
.rd-chip{background:#141414;border:1px solid #2e2e2e;color:#8f8f8f;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:12px;margin:3px;transition:border-color .15s,color .15s}
.rd-chip:hover{border-color:#5b9dff;color:#f2f2f2}
.rd-dot{width:7px;height:7px;border-radius:50%;background:#5b9dff;display:inline-block;animation:rdpulse 1.1s ease-in-out infinite}
@keyframes rdpulse{0%,80%,100%{opacity:.2;transform:scale(.85)}40%{opacity:1;transform:scale(1.1)}}
@media print{
  #topbar nav,#topbar button,#topbar .ts{display:none!important}
  #topbar{position:static;background:#fff!important;border-color:#ccc!important}
  #regime-banner{background:#fff!important;border-color:#ccc!important}
  body{background:#fff!important;color:#000!important}
  .card{background:#fff!important;border-color:#ccc!important;break-inside:avoid}
  .card h2,.regime-label,.stat .val,strong{color:#000!important}
  .stat .key,footer,td{color:#333!important}
  footer{border-color:#ccc!important}
  .tile{background:#fff!important;border-color:#ccc!important}
}

/* ── News tab ───────────────────────────────────────────────────────────────
   NATIVE, not a port. Everything here is regime-desk's own idiom: the feed
   lives in .card, on the same 1760px column as every other view, in the house
   palette. There is no #v-news variable block any more — the tab uses the
   page's colours directly, which is why nothing needed re-theming.

   Every selector is still prefixed #v-news. Nothing in here should be able to
   reach another view, and a prefix costs nothing to keep.

   THE ROW GRID IS THE POINT. The old port was 54px|76px|1fr|130px, designed
   for a narrow standalone page; stretched to 1760px it left a river of empty
   space down the middle and floated the meta far right. Five real columns —
   time, ticker+price+change, headline+summary, type, source — use the width
   instead of padding it. minmax(0,1fr) on the headline (not plain 1fr) is what
   keeps a long unbroken title from forcing a horizontal scrollbar. */
#v-news .nd-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#v-news .nd-tab{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;background:#050505;border:1px solid #2e2e2e;color:#8f8f8f;border-radius:4px;padding:5px 12px;cursor:pointer}
#v-news .nd-tab:hover{color:#f2f2f2;border-color:#5b9dff}
#v-news .nd-tab.on{background:#141414;color:#f2f2f2;border-color:#5b9dff}
#v-news .nd-tab .n{color:#6f6f6f;margin-left:6px;font-weight:400}
#v-news .nd-tab.on .n{color:#5b9dff}
#v-news .nd-live{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font-family:var(--mono);font-size:10px;color:#6f6f6f;text-transform:uppercase;letter-spacing:.5px}
#v-news .nd-dot{width:7px;height:7px;border-radius:50%;background:#3fae6a;display:inline-block;animation:rdpulse 1.6s ease-in-out infinite}
#v-news .nd-dot.stale{background:#e5484d;animation:none}
#v-news .nd-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#v-news .nd-lbl{font-family:var(--mono);font-size:10px;color:#6f6f6f;text-transform:uppercase;letter-spacing:.5px}
#v-news .nd-bar input[type=text],#v-news .nd-bar select{background:#050505;border:1px solid #2e2e2e;color:#c9c9c9;border-radius:4px;padding:4px 8px;font-family:var(--mono);font-size:12px;max-width:100%}
#v-news .nd-bar input[type=text]{width:250px}
#v-news .nd-bar input[type=text]:focus,#v-news .nd-bar select:focus{border-color:#5b9dff;outline:none}
#v-news .nd-btn{font-family:var(--mono);font-size:11px;background:#141414;border:1px solid #2e2e2e;color:#8f8f8f;border-radius:4px;padding:4px 10px;cursor:pointer}
#v-news .nd-btn:hover{border-color:#5b9dff;color:#f2f2f2}
#v-news .nd-count{margin-left:auto;font-family:var(--mono);font-size:11px;color:#6f6f6f;white-space:nowrap}
#v-news .nd-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
#v-news .nd-chips:empty{display:none}

#v-news .nd-grp{font-family:var(--mono);font-size:10px;font-weight:600;color:#8f8f8f;text-transform:uppercase;letter-spacing:1px;padding:13px 10px 5px;border-bottom:1px solid #2e2e2e}
#v-news .nd-feed>.nd-grp:first-child{padding-top:1px}
#v-news .nd-row{display:grid;grid-template-columns:58px 200px minmax(0,1fr) 108px 154px;gap:14px;padding:9px 10px;border-bottom:1px solid #141414;align-items:start;cursor:pointer;transition:background .1s}
#v-news .nd-row:hover{background:#121212}
#v-news .nd-row.pos{box-shadow:inset 2px 0 0 #2b7a4b}
#v-news .nd-row.neg{box-shadow:inset 2px 0 0 #b62324}
#v-news .nd-time{font-family:var(--mono);font-size:11px;color:#8f8f8f;white-space:nowrap;line-height:1.35;font-variant-numeric:tabular-nums}
#v-news .nd-time i{display:block;font-style:normal;font-size:10px;color:#6f6f6f}
#v-news .nd-tks{min-width:0}
#v-news .nd-tk{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
#v-news .nd-sym{font-family:var(--mono);font-size:13px;font-weight:700;color:#f2f2f2;letter-spacing:.02em;cursor:pointer}
#v-news .nd-sym:hover{color:#5b9dff}
#v-news .nd-px{font-family:var(--mono);font-size:11px;color:#8f8f8f;font-variant-numeric:tabular-nums}
#v-news .nd-chg{font-family:var(--mono);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
#v-news .nd-more{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
#v-news .nd-more span{font-family:var(--mono);font-size:10px;color:#8f8f8f;border:1px solid #2e2e2e;border-radius:4px;padding:0 4px;cursor:pointer;white-space:nowrap}
#v-news .nd-more span:hover{color:#5b9dff;border-color:#5b9dff}
#v-news .nd-more b{font-weight:600}
#v-news .nd-hl{min-width:0}
#v-news .nd-hl a{color:#f2f2f2;font-size:13px;font-weight:500;line-height:1.45;overflow-wrap:break-word}
#v-news .nd-hl a:hover{color:#5b9dff;text-decoration:none}
#v-news .nd-sum{color:#8f8f8f;font-size:12px;line-height:1.5;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:break-word}
#v-news .nd-row.open .nd-sum{display:block;overflow:visible}
#v-news .nd-typcell{min-width:0}
#v-news .nd-typ{font-family:var(--mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#8f8f8f;border:1px solid #2e2e2e;border-radius:4px;padding:1px 5px;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#v-news .nd-src{font-family:var(--mono);font-size:11px;color:#6f6f6f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-top:1px}

#v-news .nd-empty{padding:38px 12px;text-align:center;color:#8f8f8f}
#v-news .nd-empty h3{font-family:var(--mono);font-size:13px;color:#c9c9c9;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
#v-news .nd-empty.bad h3{color:#e5484d}

#v-news .nd-book{padding:4px 2px 2px}
#v-news .nd-book p{color:#8f8f8f;font-size:13px;line-height:1.55;max-width:820px;margin-bottom:10px}
#v-news .nd-drop{display:block;border:1px dashed #2e2e2e;border-radius:4px;background:#050505;padding:26px 16px;text-align:center;cursor:pointer;margin:12px 0}
#v-news .nd-drop:hover,#v-news .nd-drop.over{border-color:#5b9dff;background:#0e0e0e}
#v-news .nd-drop input[type=file]{display:none}
#v-news .nd-drop .big{font-family:var(--mono);font-size:12px;color:#5b9dff;text-transform:uppercase;letter-spacing:.5px}
#v-news .nd-drop .sml{color:#6f6f6f;font-size:11px;margin-top:5px}
#v-news .nd-paste{width:100%;background:#050505;border:1px solid #2e2e2e;color:#c9c9c9;border-radius:4px;padding:9px;font-family:var(--mono);font-size:12px;resize:vertical}
#v-news .nd-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#v-news .nd-msg{font-family:var(--mono);font-size:11px;line-height:1.6;margin-top:10px;padding:9px 11px;border:1px solid #2e2e2e;border-radius:4px;background:#050505;color:#8f8f8f}
#v-news .nd-msg.bad{color:#e5484d;border-color:#5e2626}
#v-news .nd-msg b{color:#c9c9c9}
#v-news .nd-bookhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:#6f6f6f;padding:2px 2px 9px;border-bottom:1px solid #2e2e2e}
#v-news .nd-bookhead b{color:#c9c9c9}

/* Type badges. House palette, not news-desk's neons — same hues the rest of
   the dashboard uses for good/bad/warn/info. */
#v-news .nd-typ.t-upgrade,#v-news .nd-typ.t-fda{color:#3fae6a;border-color:#2d5a38}
#v-news .nd-typ.t-downgrade,#v-news .nd-typ.t-legal{color:#e5484d;border-color:#5e2626}
#v-news .nd-typ.t-earnings,#v-news .nd-typ.t-guidance,#v-news .nd-typ.t-8k,#v-news .nd-typ.t-filings{color:#d4a72c;border-color:#5c4a1c}
#v-news .nd-typ.t-analyst,#v-news .nd-typ.t-dividend,#v-news .nd-typ.t-macro{color:#5b9dff;border-color:#1f3350}
#v-news .nd-typ.t-ma,#v-news .nd-typ.t-offering,#v-news .nd-typ.t-press{color:#a371f7;border-color:#432c72}

/* Below ~1180px the source column is the first thing that stops earning its
   width, so it moves under the headline rather than squeezing everything. */
@media (max-width:1180px){
  #v-news .nd-row{grid-template-columns:56px 186px minmax(0,1fr) 104px;gap:12px}
  #v-news .nd-src{grid-column:2/-1;grid-row:2;padding-top:0}
}
@media (max-width:820px){
  #v-news .nd-row{grid-template-columns:52px minmax(0,1fr);gap:6px 10px;padding:9px 6px}
  #v-news .nd-time{grid-column:1;grid-row:1}
  #v-news .nd-tks{grid-column:2;grid-row:1}
  #v-news .nd-hl{grid-column:1/-1;grid-row:2}
  #v-news .nd-typcell{grid-column:1/-1;grid-row:3}
  #v-news .nd-src{grid-column:1/-1;grid-row:4}
  #v-news .nd-bar input[type=text]{width:100%;flex:1 1 160px}
  #v-news .nd-count{margin-left:0;flex-basis:100%}
}

/* ── finvisible design system (assets/fv.css, 2026-09-22), applied regime-desk 2026-09-23 ──
   Same ground, greys, meaning colours, radius and label treatment as finvisible,
   so the suite reads as one product. Each app adds ONE accent for furniture
   (brand, active tab, links, hover, focus) — owner, 2026-09-23: "slightly more
   color, maybe one specific accent palette". Gain/loss/warn stay meaning-only. */
:root{
  --bg:#050505;--panel:#0e0e0e;--panel-2:#141414;--line:#1d1d1d;--line-2:#2e2e2e;
  --text:#f2f2f2;--text-2:#c9c9c9;--text-3:#8f8f8f;--text-4:#5f5f5f;
  --gain:#3fae6a;--loss:#e5484d;--warn:#d4a72c;
  --accent:#5b9dff;--accent-deep:#4677c0;--accent-tint:#131d2d;
  --fs-label:10.5px;--track:.14em;--radius:4px;
}
body{font-size:13px}
::selection{background:var(--accent-tint);color:var(--text)}
:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
#topbar{background:var(--bg)!important;border-bottom:1px solid var(--line-2)}
#topbar h1{color:var(--accent)!important;letter-spacing:var(--track)}
#topbar nav a{border-radius:0!important;border-bottom:2px solid transparent;padding:4px 10px 3px}
#topbar nav a:hover{background:none!important;color:var(--text)!important}
#topbar nav a.active{background:none!important;color:var(--text)!important;border-bottom-color:var(--accent)}
.card h2{font-size:var(--fs-label)!important;font-weight:500!important;letter-spacing:var(--track)!important;color:var(--text-3)!important;border-bottom-color:var(--line)!important}
.card h2::before{content:"";display:inline-block;width:6px;height:6px;background:var(--accent);margin:0 8px 1px 0;vertical-align:middle}
.stat .key,.tile .sub{letter-spacing:var(--track)}
html.light .card h2::before{background:#0969da}
html.light #topbar{background:#f6f8fa!important}

/* ── PAPA's layout, carried over (owner, 2026-09-23) ─────────────────────────
   Use the whole width, keep rows tight, and put the space BETWEEN panels. */
#main{max-width:none;padding:16px 24px}
#topbar,#regime-banner{padding-left:24px!important;padding-right:24px!important}
.card{padding:16px 18px;margin-bottom:16px}
th{padding:5px 8px}
td{padding:4px 8px}
/* Analysis was seven cards in one column. On a wide screen the three short
   prose cards sit three across and the two data panels side by side; the
   order is fixed by renderAnalysis, so position is a stable handle. */
@media(min-width:1400px){
  #v-analysis.active{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));column-gap:16px;align-items:start}
  #v-analysis.active>*{grid-column:1/-1}
  #v-analysis.active>.card{margin-bottom:16px}
  #v-analysis.active>.card:nth-child(2),#v-analysis.active>.card:nth-child(3),#v-analysis.active>.card:nth-child(4){grid-column:span 2}
  #v-analysis.active>.card:nth-child(6),#v-analysis.active>.card:nth-child(7){grid-column:span 3}
}
</style>
</head>

<script>
(function(){
const S = window.SNAPSHOT;
// Stocks, Memory and Portfolios moved to PAPA on 2026-07-29 and are hidden
// here. Their renderers and their v-* containers are deliberately left in
// place: route() only touches views listed below, so an unlisted one simply
// never becomes active, and #stocks now falls back to Home.
//
// Portfolios was then removed outright on 2026-09-24 (owner) — renderer,
// container and the frozen books in the snapshot. The books live in PAPA.
const VIEWS = ["home","analysis","bubble","news"];
const LABELS = ["Home","Analysis","Bubble","News"];


// Theme persistence
const _savedTheme = localStorage.getItem('rd-theme')||'dark';
if(_savedTheme==='light') document.documentElement.classList.add('light');

function pct(v){return (v>=0?"+":"")+((v||0)*100).toFixed(1)+"%"}
function pillClass(s){return s==="bullish"?"bull":s==="bearish"?"bear":s==="elevated"||s==="elev"?"elev":s==="moderate"||s==="mod"?"mod":"neut"}
function pill(s,label){return`<span class="pill ${pillClass(s)}">${label||s}</span>`}

// Topbar nav
const nav=document.getElementById("nav");
VIEWS.forEach((v,i)=>{const a=document.createElement("a");a.href="#"+v;a.textContent=LABELS[i];a.id="nav-"+v;nav.appendChild(a);});

// Dark/light toggle button
const themeBtn=document.createElement('button');
themeBtn.id='theme-btn';
themeBtn.textContent=_savedTheme==='light'?'🌙':'☀';
themeBtn.style.cssText='background:none;border:1px solid #2e2e2e;color:#8f8f8f;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:12px;margin-left:4px';
themeBtn.onclick=()=>{const isLight=document.documentElement.classList.toggle('light');localStorage.setItem('rd-theme',isLight?'light':'dark');themeBtn.textContent=isLight?'🌙':'☀';};
nav.after(themeBtn);

// Stale warning in topbar
const genDate=new Date(S.generated);
const stale=(Date.now()-genDate)/86400000>2;
document.getElementById("ts").innerHTML=`Generated: ${S.generated}${stale?' <span style="color:#d4a72c;font-weight:600">● stale</span>':''}`;

// Sparkline helper
function sparkline(history,key,w=40,h=14){
  if(!history||history.length<2) return '';
  const vals=history.map(d=>d[key]||0);
  const mn=Math.min(...vals),mx=Math.max(...vals),range=mx-mn||0.001;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-(v-mn)/range*h).toFixed(1)}`).join(' ');
  const col=vals[vals.length-1]>=0?'#3fae6a':'#e5484d';
  return`<svg width="${w}" height="${h}" style="vertical-align:middle;margin-left:4px;opacity:.8"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

// Keyboard shortcuts modal
const modal=document.createElement('div');
modal.id='kbd-modal';
modal.style.cssText='display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);align-items:center;justify-content:center';
modal.innerHTML=`<div style="background:#0e0e0e;border:1px solid #2e2e2e;border-radius:4px;padding:24px;min-width:280px">
  <h3 style="margin-bottom:14px;color:#f2f2f2">Keyboard Shortcuts</h3>

// Distribution — SVG box-and-whisker: whisker p10→p90, box p25→p75, median line, zero ref
function distBar(p10,p25,p50,p75,p90){
  var lo=-0.20,hi=0.30,span=hi-lo;
  var W=154,pad=10,aw=W-2*pad;
  function px(v){return pad+Math.max(0,Math.min(aw,((v-lo)/span)*aw));}
  function fmt(v){return (v>=0?'+':'')+(v*100).toFixed(0)+'%';}
  var boxCol=p50>=0?'#2b7a4b':'#cf222e';
  var x10=px(p10),x25=px(p25),x50=px(p50),x75=px(p75),x90=px(p90);
  var zx=px(0);
  var bw=Math.max(3,x75-x25);
  return '<svg width="'+W+'" height="38" viewBox="0 0 '+W+' 38" style="display:block;overflow:visible">'
    // Zero reference — dashed
    +'<line x1="'+zx.toFixed(1)+'" y1="2" x2="'+zx.toFixed(1)+'" y2="26" stroke="rgba(240,246,252,0.2)" stroke-width="1" stroke-dasharray="2,2"/>'
    // Whisker line

    // Whisker caps

    +'<line x1="'+x90.toFixed(1)+'" y1="9" x2="'+x90.toFixed(1)+'" y2="19" stroke="#6f6f6f" stroke-width="1.5"/>'

    +'<rect x="'+x25.toFixed(1)+'" y="7" width="'+bw.toFixed(1)+'" height="14" fill="'+boxCol+'" rx="2" opacity="0.9"/>'
    // Median line
    +'<line x1="'+x50.toFixed(1)+'" y1="5" x2="'+x50.toFixed(1)+'" y2="23" stroke="#f2f2f2" stroke-width="2" stroke-linecap="round"/>'
    // Labels
    +'<text x="'+x10.toFixed(1)+'" y="36" text-anchor="middle" fill="#6f6f6f" font-size="9" font-family="system-ui,sans-serif">'+fmt(p10)+'</text>'

// ── TRAJECTORY VERDICT ───────────────────────────────────────────────────
//
// Owner, 2026-09-14: wanted the same click-into explanation the Risk Axes got.
// The verdict was an if-ladder buried in one line, which cannot explain itself,
// so it is now a table read top to bottom, first match wins, and the label and
// the explainer walk the same table.
//
// ONE BRANCH WAS WRONG AND IS FIXED HERE. The old ladder's final `else` caught
// every case of flat returns with vol moving 2pp or more IN EITHER DIRECTION,
// and labelled all of it "Vol Compression — vol falling". Flat returns with vol
// RISING 2pp was therefore published as compression. That case is now its own
// row, Vol Expansion; every other state labels exactly as before.
const TV_R=0.005, TV_V=0.02;
const TV_RULES=[
  {name:'Goldilocks',col:'#3fae6a',when:'return shift above +0.5pp and vol falling',
   test:(r,v)=>r>TV_R&&v<0,
   desc:'Returns improving while vol falls — the strongest possible setup. Lean into risk.'},
  {name:'Bullish but Choppy',col:'#d4a72c',when:'return shift above +0.5pp, vol flat or rising',
   test:(r,v)=>r>TV_R&&v>=0,
   desc:'Returns rising but vol expanding — trend intact, expect drawdowns within it.'},
  {name:'Stable',col:'#5b9dff',when:'return shift within ±0.5pp and vol shift within ±2pp',
   test:(r,v)=>Math.abs(r)<=TV_R&&Math.abs(v)<TV_V,
   desc:'Momentum and vol stable — regime continuation most likely.'},
  {name:'Deteriorating',col:'#e5484d',when:'return shift below −0.5pp and vol rising',
   test:(r,v)=>r<-TV_R&&v>0,
   desc:'Returns falling and vol rising — classic regime-change warning. Trim risk.'},
  {name:'Losing Momentum',col:'#d4a72c',when:'return shift below −0.5pp, vol flat or falling',
   test:(r,v)=>r<-TV_R,
   desc:'Returns rolling over while vol contained — watch for trend break.'},
  {name:'Vol Expansion',col:'#d4a72c',when:'return shift within ±0.5pp, vol up 2pp or more',
   test:(r,v)=>v>=TV_V,
   desc:'Vol rising without a move in returns — the market is getting jumpier before it has picked a direction.'},
  {name:'Vol Compression',col:'#5b9dff',when:'return shift within ±0.5pp, vol down 2pp or more',
   test:()=>true,
   desc:'Vol falling without momentum gain — coiling phase; direction undetermined.'},
];
function _tvVerdict(r,v){for(const x of TV_RULES){if(x.test(r,v))return x;}return TV_RULES[TV_RULES.length-1];}

function _cardVerdict(){
  var h=spy.history||[];if(h.length<6)return'';
  var n=h.length;var recent=h.slice(Math.max(0,n-5));var prior=h.slice(Math.max(0,n-10),Math.max(0,n-5));
  function avg(arr,k){return arr.reduce(function(a,b){return a+(b[k]||0);},0)/(arr.length||1);}
  var rRecent=avg(recent,'ret_20d'),rPrior=avg(prior,'ret_20d');
  var vRecent=avg(recent,'vol_20d')*Math.sqrt(252),vPrior=avg(prior,'vol_20d')*Math.sqrt(252);
  var rDelta=rRecent-rPrior,vDelta=vRecent-vPrior;
  var hit=_tvVerdict(rDelta,vDelta);
  var verdict=hit.name,vCol=hit.col,vDesc=hit.desc;
  var WHY='why-verdict';
  var hero=_rdHero('Verdict',verdict,'last 5 vs prior 5',vCol,null,WHY);
  var tiles=[
    _rdTile('Return shift',`<span style="color:${rDelta>=0?'#3fae6a':'#e5484d'}">${rDelta>=0?'▲':'▼'} ${(rDelta>=0?'+':'')+(rDelta*100).toFixed(2)} pp</span>`,'',undefined,WHY),
    _rdTile('Vol shift',`<span style="color:${vDelta<=0?'#3fae6a':'#e5484d'}">${vDelta<=0?'▼':'▲'} ${(vDelta>=0?'+':'')+(vDelta*100).toFixed(1)} pp</span>`,'',undefined,WHY),
    _rdTile('20d return (now)',`<span style="color:${rRecent>=0?'#3fae6a':'#e5484d'}">${(rRecent*100).toFixed(2)}%</span>`,'',undefined,WHY),
    _rdTile('Ann. vol (now)',`<span style="color:${vRecent>0.22?'#d4a72c':'#c9c9c9'}">${(vRecent*100).toFixed(0)}%</span>`,'',undefined,WHY)
  ].join('');

  // How far each shift sits from a line that would change the label. The vol
  // line that matters depends on the return shift: inside ±0.5pp the vol
  // boundaries are ±2pp; outside it the only vol boundary is zero.
  var rDist=Math.min(Math.abs(rDelta-TV_R),Math.abs(rDelta+TV_R))*100;
  var vDist=(Math.abs(rDelta)<=TV_R?Math.min(Math.abs(vDelta-TV_V),Math.abs(vDelta+TV_V)):Math.abs(vDelta))*100;
  var pp=function(x,d){return(x>=0?'+':'')+(x*100).toFixed(d)+'pp';};
  var ladder=TV_RULES.map(function(x,i){
    var on=x===hit;
    return `<div class="rd-rule ${on?'fired':''}"><span class="rd-rule-n">${i+1}</span><b style="color:${x.col}">${x.name}</b>${on?'<span class="rd-tag">this one</span>':''}<div style="font-size:12px;color:#8f8f8f;margin-top:2px">${x.when}</div></div>`;
  }).join('');
  var chart=function(vals,label){return svgLineChart(vals,440,110,label);};
  var panel=_rdPanel(WHY,`
    <h4>What this compares</h4>
    <p>Not where the market is — that is Regime Analysis, above. This asks whether the trend is <b>getting better or wearing out</b>. It averages SPY's 20-day return over the last 5 sessions and compares it with the 5 before that, and does the same for volatility.</p>
    <h4>The two numbers it is built from</h4>
    <div class="rax-sum">
      <span class="rax-chip">20-day return: last 5 <b>${(rRecent*100).toFixed(2)}%</b> vs prior 5 <b>${(rPrior*100).toFixed(2)}%</b> → <b>${pp(rDelta,2)}</b></span>
      <span class="rax-chip">Volatility: last 5 <b>${(vRecent*100).toFixed(1)}%</b> vs prior 5 <b>${(vPrior*100).toFixed(1)}%</b> → <b>${pp(vDelta,1)}</b></span>
    </div>
    <p>A return shift only counts once it passes ±0.5pp. A vol shift counts on direction alone, except when returns are flat — then it has to move 2pp either way to matter.</p>
    <h4>The rules, read top to bottom — the first one that fits is the label</h4>
    ${ladder}
    <p style="margin-top:9px">The return shift is <span class="rd-num">${rDist.toFixed(2)}pp</span> from a line that would change this verdict, and the vol shift <span class="rd-num">${vDist.toFixed(1)}pp</span>.</p>
    <h4>The last 20 sessions, as paths</h4>
    <div class="rd-charts">
      ${chart(h.map(function(d){return d.ret_5d||0;}),'Rolling 5d return')}
      ${chart(h.map(function(d){return d.ret_20d||0;}),'Rolling 20d return')}
      ${chart(h.map(function(d){return (d.vol_20d||0)*Math.sqrt(252);}),'Annualized vol')}
      ${chart(h.map(function(d){return d.drawdown_60d||0;}),'60d drawdown')}
    </div>`);
  return _rdSummaryCard('Trajectory Verdict',vCol,hero,tiles,`<span style="color:#c9c9c9">${vDesc}</span>`,panel);
}
// ── REGIME ANALYSIS ──────────────────────────────────────────────────────
//
// Owner, 2026-09-14: same click-into explanation as the Risk Axes. Every tile
// now opens a panel, and the regime label opens the rule ladder that produced
// it. The ladder is published by the snapshot builder (spy.explain) from the
// SAME table the classifier walks, so the highlighted rule and the label on
// the card cannot disagree.
//
// BREADTH, PERSISTENCE AND REVERSAL ARE MEASURED BY THE SCAN (2026-09-14).
// Until that day the first two were a hardcoded 0.5 and the third a four-step
// lookup shown as a percentage. They now come from scan/regime_measures.py via
// spy.measures, each with the evidence behind it, and each can be null — which
// renders as "not measured" with the scan's reason, never as a middling value.
const RD_KEY={
  ret_20d:['SPY 20-day return',v=>pct(v)],
  drawdown_60d:['SPY 60-day drawdown',v=>pct(v)],
  vol_20d:['SPY volatility, annualized',v=>((v||0)*Math.sqrt(252)*100).toFixed(0)+'%'],
};
function _rdCond(c){
  const k=RD_KEY[c.key]||[c.key,v=>String(v)];
  const op=c.op==='>'?'above':c.op==='<'?'below':'within ±';
  const thr=c.threshold===0?'0%':c.op==='abs<'?k[1](c.threshold).replace('+',''):k[1](c.threshold);
  return`<span class="rax-chip ${c.met?'met':''}">${k[0]} ${op} <b>${thr}</b> · now <b>${k[1](c.value)}</b> ${c.met?'&#10003;':'&#10007;'}</span>`;
}
function _rdLadder(ex,fmt){
  const rows=ex.rules.map((r,i)=>`<div class="rd-rule ${r.fired?'fired':''} ${r.shadowed?'shadowed':''}">
    <span class="rd-rule-n">${i+1}</span><b>${fmt(r.result)}</b>${r.fired?'<span class="rd-tag">this one</span>':r.shadowed?'<span class="rd-tag dim">also true, but outranked</span>':''}
    <div class="rax-sum" style="margin:5px 0 0 0">${r.conditions.map(_rdCond).join('')}</div></div>`).join('');
  return rows+`<div class="rd-rule ${ex.fell_through?'fired':''}"><span class="rd-rule-n">${ex.rules.length+1}</span><b>${fmt(ex.fallback)}</b>${ex.fell_through?'<span class="rd-tag">this one</span>':''}<div style="font-size:12px;color:#8f8f8f;margin-top:2px">if none of the rules above fit</div></div>`;
}
// The unfired rule needing the least movement to fire, in percentage points.
// Vol is measured in annualized points so it is on the same scale as the tile.
function _rdNearest(ex){
  const scale=c=>c.key==='vol_20d'?Math.sqrt(252)*100:100;
  let best=null;
  ex.rules.forEach(r=>{
    if(r.fired)return;
    const unmet=r.conditions.filter(c=>!c.met);
    // SIGNED distance in the direction the condition needs. An earlier version
    // compared absolute values, so a 20-day return of -2.3% scored as 2.7pp
    // from BOTH +5% and -5%, and named Bull Trend as the nearest label when it
    // was 7.3pp away. Caught by reading the rendered panel, not by a test.
    const need=c=>c.op==='>'?c.threshold-c.value:c.op==='<'?c.value-c.threshold:Math.abs(c.value)-c.threshold;
    const gap=unmet.reduce((a,c)=>a+Math.max(0,need(c))*scale(c),0);
    if(!best||gap<best.gap)best={r,unmet,gap};
  });
  return best;
}
// Which rules a reading feeds, straight off the published table.
function _rdFeeds(ex,key){
  return ex.rules.filter(r=>r.conditions.some(c=>c.key===key))
    .map(r=>{const c=r.conditions.find(x=>x.key===key);return`${r.result} (${(RD_KEY[key]||[key,String])[1](c.threshold).replace('+','')} ${c.op==='>'?'or above':c.op==='<'?'or below':''})`;});
}

function _cardRegimeMetrics(){
  const reg=spy.regime||"—";
  const regCol=/bull|risk[- ]?on|expansion|goldilock|calm|low[- ]?vol/i.test(reg)?'#3fae6a':/bear|risk[- ]?off|contraction|stress|crisis|high[- ]?vol/i.test(reg)?'#e5484d':'#5b9dff';
  const arr=v=>v>0.0005?'▲':v<-0.0005?'▼':'·';
  const rc=v=>v>0.0005?'#3fae6a':v<-0.0005?'#e5484d':'#8f8f8f';
  const r5=spy.ret_5d||0,r20=spy.ret_20d||0,vol=(spy.vol_20d||0)*Math.sqrt(252),dd=spy.drawdown_60d||0;
  const EX=(spy.explain||{});
  const exR=EX.regime;
  const M=spy.measures||{};
  const mB=M.breadth||{value:null,reason:'not in this snapshot'};
  const mP=M.persistence||{value:null,reason:'not in this snapshot'};
  const mR=M.reversal||{value:null,reason:'not in this snapshot'};
  const has=m=>m&&typeof m.value==='number';
  const p0=v=>(v*100).toFixed(0)+'%';
  // An ordinal, for "14th percentile".
  const nth=n=>{const t=n%100;return n+(t>=11&&t<=13?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th'));};
  const hero=_rdHero('Regime',reg.toUpperCase(),`${spy.regime_streak||"—"} day streak`,regCol,null,'why-regime');
  // Overnight deltas used to be their own full-width row above this card,
  // which meant reading a number here and its change 150px away. A delta
  // belongs against the reading it is a delta OF, so it now sits under the
  // tile. Only the four readings that HAVE a history series get one.
  const _h=spy.history||[];
  const _cur=_h[_h.length-1]||{}, _prv=_h.length>=2?_h[_h.length-2]:null;
  const dOf=k=>_prv?((_cur[k]||0)-(_prv[k]||0)):null;
  const dTag=(d,goodUp,mult)=>{
    if(d===null) return '';
    const v=d*(mult||1), flat=Math.abs(v)<0.00005;
    const col=flat?'#6f6f6f':((goodUp?v>=0:v<=0)?'#3fae6a':'#e5484d');

  const tiles=[

    _rdTile('20d return',`<span style="color:${rc(r20)}">${arr(r20)} ${pct(r20)}</span>`,dTag(dOf('ret_20d'),true),undefined,'why-r20'),
    _rdTile('20d vol (ann.)',`<span style="color:${vol>0.22?'#d4a72c':'#c9c9c9'}">${(vol*100).toFixed(0)}%</span>`,dTag(dOf('vol_20d'),false,Math.sqrt(252)),undefined,'why-vol'),
    _rdTile('60d drawdown',`<span style="color:${dd<-0.05?'#e5484d':'#c9c9c9'}">${pct(dd)}</span>`,dTag(dOf('drawdown_60d'),true),undefined,'why-dd'),
    // Breadth is coloured by where it sits in its OWN three-year history —
    // bottom fifth red, top fifth green — rather than by a fixed level, which
    // would be an invented threshold on a number with no natural one.
    _rdTile('Breadth',has(mB)
      ?`<span style="color:${mB.pct_rank<0.2?'#e5484d':mB.pct_rank>0.8?'#3fae6a':'#c9c9c9'}">${p0(mB.value)}</span>`
      :nm,
      has(mB)?`<div style="color:#6f6f6f;font-size:10px;margin-top:5px;white-space:nowrap">${nth(Math.round(mB.pct_rank*100))} pctile, 3y</div>`:'',undefined,'why-breadth'),
    _rdTile('Persistence',has(mP)
      ?`<span style="color:#c9c9c9">${p0(mP.value)}</span>`:nm,
      has(mP)?`<div style="color:#6f6f6f;font-size:10px;margin-top:5px;white-space:nowrap">${typeof mP.base_rate==='number'?'any day: '+p0(mP.base_rate):'still '+mP.label+' in '+mP.horizon+'d'}</div>`:'',undefined,'why-persist'),
    // Reversal is never coloured on its own: 37% is only alarming or calming
    // against the any-day rate, so the comparison is printed instead.
    _rdTile('Reversal risk',has(mR)
      ?`<span style="color:#c9c9c9">${p0(mR.value)}</span>`:nm,
      has(mR)&&typeof mR.base_rate==='number'?`<div style="color:#6f6f6f;font-size:10px;margin-top:5px;white-space:nowrap">any day: ${p0(mR.base_rate)}</div>`:'',undefined,'why-rev')
  ].join('');
  const foot=`<strong style="color:#8f8f8f">◆ ANALOG CONTEXT · </strong>${S.analog&&S.analog.regime_context||"—"}<span style="float:right;color:#6f6f6f">${S.generated||''}</span>`;

  // ---- the panels ----
  const noEx=`<p style="color:#8f8f8f">The rule-by-rule breakdown is not in this snapshot. It fills in on the next daily build.</p>`;
  const near=exR?_rdNearest(exR):null;
  const nearTxt=near?`<p style="margin-top:9px"><b>Closest other label: ${near.r.result}.</b> It needs ${near.unmet.map(c=>{const k=RD_KEY[c.key]||[c.key,String];return`${k[0]} to move from <span class="rd-num">${k[1](c.value)}</span> to ${c.op==='>'?'above':'below'} <span class="rd-num">${k[1](c.threshold)}</span>`;}).join(', and ')}.</p>`:'';
  const feeds=key=>exR?_rdFeeds(exR,key):[];
  const feedsTxt=key=>{const f=feeds(key);return f.length?`<h4>Where it counts</h4><p>It feeds ${f.length===1?'one regime rule':f.length+' regime rules'}: ${f.join('; ')}.</p>`:`<h4>Where it counts</h4><p>No regime rule uses it. It is one of the four numbers the analog matcher compares against history, and it is the fastest read on direction on this card.</p>`;};
  const panels=
    _rdPanel('why-regime',`
      <h4>What this is</h4>
      <p>A <b>label, not a forecast</b>. Three readings — SPY's 20-day return, its 60-day drawdown and its volatility — are checked against the rules below from the top. The first rule that fits names the regime. It has held for <span class="rd-num">${spy.regime_streak||'—'}</span> session${spy.regime_streak===1?'':'s'}: that is how many of the latest sessions in a row classify the same way.</p>
      ${exR?`<h4>The rules, top to bottom</h4>${_rdLadder(exR,x=>x)}${nearTxt}`:noEx}`)
   +_rdPanel('why-r5',`
      <h4>What this measures</h4><p>How far SPY has moved over the last 5 trading sessions. The fastest reading on the card, and the noisiest.</p>
      ${feedsTxt('ret_5d')}`)
   +_rdPanel('why-r20',`
      <h4>What this measures</h4><p>How far SPY has moved over the last 20 trading sessions — about a month. The main trend reading on the card.</p>
      ${feedsTxt('ret_20d')}`)
   +_rdPanel('why-vol',`
      <h4>What this measures</h4><p>How much SPY has been swinging day to day over the last 20 sessions, scaled up to a yearly figure so it reads like an options-market volatility. Around 15% is ordinary; above about 22% it is shaded amber.</p>
      ${feedsTxt('vol_20d')}`)
   +_rdPanel('why-dd',`
      <h4>What this measures</h4><p>How far SPY sits below its highest close of the last 60 sessions. Zero means it is at that high.</p>
      ${feedsTxt('drawdown_60d')}`)
   +_rdPanel('why-breadth',`
      <h4>What this measures</h4>
      <p>How many stocks are taking part. Specifically: the share of the names in the scan universe that closed above their own 50-day average. A market can rise on a handful of giants while most stocks fall; this is the number that tells those apart.</p>
      ${has(mB)?`
      <h4>What it is reading</h4>
      <div class="rax-sum">
        <span class="rax-chip">above their 50-day average: <b>${p0(mB.value)}</b> of <b>${mB.n.toLocaleString()}</b> names</span>

      <p>Lower than on <span class="rd-num">${(100-Math.round(mB.pct_rank*100))}%</span> of the <span class="rd-num">${mB.days}</span> sessions in the last three years — the <b>${nth(Math.round(mB.pct_rank*100))} percentile</b>.</p>
      <p style="color:#8f8f8f">One bias, stated: the history is measured on today's universe. Names that were delisted along the way are not in it, and survivors spent more time above their averages, so past readings lean a little high and today's rank a little low.</p>`
      :`<h4>Not measured</h4><p>${mB.reason||'No reading in this snapshot.'}</p>`}`)
   +_rdPanel('why-persist',`
      <h4>What this measures</h4>
      <p>How often the regime on this card has stuck. Of every past session that carried today's label, the share that still carried it ${mP.horizon||20} sessions later. It answers "will this still say ${spy.regime||'the same thing'} in a month" from what actually happened, not from a guess.</p>
      ${has(mP)?`
      <h4>What it is reading</h4>
      <div class="rax-sum">
        <span class="rax-chip">still ${mP.label} ${mP.horizon} sessions later: <b>${mP.held}</b> of <b>${mP.days}</b> past sessions</span>
        <span class="rax-chip">separate spells: <b>${mP.spells}</b></span>
        ${mP.median_spell!=null?`<span class="rax-chip">typical spell: <b>${mP.median_spell}</b> sessions</span>`:''}
        <span class="rax-chip">this spell so far: <b>${mP.streak}</b> sessions</span>
      </div>
      ${typeof mP.base_rate==='number'?(()=>{
        const n=Math.max(1,mP.spells), se=Math.sqrt(Math.max(0.0001,mP.base_rate*(1-mP.base_rate))/n), gap=mP.value-mP.base_rate;
        return `<h4>Against the odds of picking any session</h4>
        <p>${mP.label} is the label ${mP.horizon} sessions on for <span class="rd-num">${p0(mP.base_rate)}</span> of all sessions, whatever they started as. ${
          Math.abs(gap)<se
            ?`So a ${mP.label} session staying ${mP.label} ${p0(mP.value)} of the time is <b>no stickier than that, within the noise</b> of ${n} spells (about ±${Math.round(se*100)} points). A label this common will usually still be on the card a month from now simply because it usually is.`
            :gap>0?`So ${mP.label} is <b>genuinely sticky</b>: ${Math.round(gap*100)} points above that, beyond the ±${Math.round(se*100)} points of noise in ${n} spells.`
            :`So ${mP.label} is <b>less sticky than a random session</b>: ${Math.round(-gap*100)} points below, beyond the ±${Math.round(se*100)} points of noise in ${n} spells.`}</p>`;})():''}
      <p>${mP.median_spell!=null&&mP.streak>mP.median_spell
          ?`This spell has already run longer than a typical ${mP.label} spell.`
          :mP.median_spell!=null?`This spell is still inside the length a typical ${mP.label} spell runs.`:''}</p>
      <p style="color:#8f8f8f">"Still ${mP.label} later" counts a session even if the label dipped out and came back in between. Neighbouring sessions are not independent — forty days in one long spell are nearer one observation than forty — which is why the spell count sits beside the day count, and why a rate resting on fewer than three spells is withheld.</p>`
      :`<h4>Not measured</h4><p>${mP.reason||'No reading in this snapshot.'}</p>`}`)
   +_rdPanel('why-rev',(()=>{
      if(!has(mR)) return `<h4>What this measures</h4>
        <p>How often SPY's next 20 sessions have gone the opposite way to its last 20, from days like today.</p>
        <h4>Not measured</h4><p>${mR.reason||'No reading in this snapshot.'}</p>`;
      // The honest yardstick for "is this different from any day": one
      // standard error, on the number of SEPARATE episodes rather than the
      // number of days, because neighbouring analog days share most of their
      // forward window and are not independent draws.
      const n=Math.max(1,mR.episodes||mR.analogs);
      const se=Math.sqrt(Math.max(0.0001,mR.base_rate*(1-mR.base_rate))/n);
      const gap=mR.value-mR.base_rate;
      const verdict=Math.abs(gap)<se
        ?`<b>no clear difference from any day.</b> ${Math.round(Math.abs(gap)*100)<1?'The two rates are within a point of each other':'The '+Math.round(Math.abs(gap)*100)+'-point gap is smaller than the noise'} — ${n} episodes carry about ±${Math.round(se*100)} points of noise.`
        :gap>0?`<b>reversals have been more common from states like today</b> — ${Math.round(gap*100)} points above any day, beyond the ±${Math.round(se*100)} points of noise in ${n} episodes.`
        :`<b>reversals have been less common from states like today</b> — ${Math.round(-gap*100)} points below any day, beyond the ±${Math.round(se*100)} points of noise in ${n} episodes.`;
      const dirn=mR.trailing_20d<0?'down':'up', opp=mR.trailing_20d<0?'up':'down';
      return `
      <h4>What this measures</h4>
      <p>From days like today, how often did the trend flip? SPY is ${dirn} over its last 20 sessions. Of the <b>30 past days most like today</b> — the same analog days the stock signals are built from — this counts how many saw SPY's <b>next</b> 20 sessions go ${opp} instead.</p>
      <h4>What it is reading</h4>
      <div class="rax-sum">
        <span class="rax-chip">days like today that reversed: <b>${mR.reversed}</b> of <b>${mR.analogs}</b> → <b>${p0(mR.value)}</b></span>
        <span class="rax-chip">separate episodes: <b>${mR.episodes}</b></span>
        <span class="rax-chip">any day in 3 years: <b>${mR.base_reversed}</b> of <b>${mR.base_days}</b> → <b>${p0(mR.base_rate)}</b></span>
      </div>
      <h4>So</h4>
      <p>Compared with any day, ${verdict}</p>
      <p style="color:#8f8f8f">This replaced a four-step lookup that could only ever read 25, 35, 50 or 70 and was shown as though it were a probability.</p>`;
    })());
  return _rdSummaryCard('Regime Analysis',regCol,hero,tiles,foot,panels);
}
// Four series, not two. history carries ret_5d, ret_20d, vol_20d and
// drawdown_60d for all 20 sessions; this panel plotted half of them and
// stretched the other half across the full width. Each svgLineChart declares a
// 440px viewBox, so grid2 was blowing each one up to ~880px — which is what
// "the charts do not earn their width" was describing. Four across puts them
// back near their native size AND doubles the information, in the same height.
//
// auto-fit rather than repeat(4,1fr) so this degrades to 2-up and then 1-up on
// narrow viewports instead of forcing a horizontal scrollbar.
function _cardTrajectory(){
  const h=spy.history||[];
  const chart=(vals,label)=>svgLineChart(vals,440,110,label);
  return`<div class="card"><h2>SPY Trajectory — Last 20 Sessions</h2>
  <p style="color:#8f8f8f;font-size:12px;margin-bottom:10px">Rolling 5-day and 20-day return, annualized realized volatility, and 60-day drawdown — the same four readings the summary tiles give as points, shown as paths.</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px">
    ${chart(h.map(d=>d.ret_5d||0),'Rolling 5d return')}
    ${chart(h.map(d=>d.ret_20d||0),'Rolling 20d return')}
    ${chart(h.map(d=>(d.vol_20d||0)*Math.sqrt(252)),'Annualized vol')}
    ${chart(h.map(d=>d.drawdown_60d||0),'60d drawdown')}
  </div></div>`;
}

// SECTORS — winner/loser badges + allocation delta vs SPX benchmark
function _sectorData(){
  if(_horizon==='all') return S.sectors;
  const filtered=S.stocks.filter(s=>s.horizon===_horizon);
  if(!filtered.length) return S.sectors;
  const map={};
  filtered.forEach(s=>{
    if(!map[s.sector])map[s.sector]={edges:[],stocks:0};
    map[s.sector].edges.push(s.edge);map[s.sector].stocks++;
  });
  return Object.entries(map).map(([name,d])=>{
    const avg=d.edges.reduce((a,b)=>a+b,0)/d.edges.length;
    const breadth=d.edges.filter(e=>e>0).length/d.edges.length;
    return{name,edge:avg,breadth,stocks:d.stocks,signal:avg>0.03?'bullish':avg<-0.01?'bearish':'neutral',horizon:_horizon};
  }).sort((a,b)=>b.edge-a.edge);
}

// ── Signal API (on-demand computation, local only) ───────────────────────
// The cloud Render fallback has been retired. On-demand ticker lookups
// only succeed when run_local_api.bat is running on the user's machine.
var RD_API_PORT=7534;
var _rdApiBaseCache=null;
function _rdProbe(base){
  return fetch(base+'/api/ping',{signal:AbortSignal.timeout(3500)})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){return (d&&d.ok)?base:null;})
    .catch(function(){return null;});
}
function _rdGetApiBase(){
  // Cache the resolved base so we don't re-probe on every pin.
  if(_rdApiBaseCache) return Promise.resolve(_rdApiBaseCache);
  // Strategy: try localhost FIRST, then fall back to the cloud tunnel.
  // This is the opposite of the original order (cloud first) — reversed
  // 2026-07-09 because Chrome's Local Network Access permission prompt
  // requires "transient user activation" (a short window after the click
  // that triggered this call). Probing the cloud tunnel first burns that
  // window on a request that's usually dead anyway (trycloudflare.com
  // quick-tunnel URLs expire whenever run_tunnel.ps1 stops), so the
  // localhost request — the one that actually needs the permission
  // prompt — was firing too late for Chrome to show it. Trying localhost
  // first also means the common case (dev machine, local API running)
  // skips the api_endpoint.json fetch entirely.
  // Use 127.0.0.1, not "localhost": on dual-stack Windows machines
  // "localhost" often resolves to ::1 (IPv6) first, and run_local_api.bat's
  // waitress server only binds IPv4 (0.0.0.0) — so the browser's IPv6
  // attempt gets ECONNREFUSED before ever trying the IPv4 address that
  // actually works. Confirmed 2026-07-09: curl to 127.0.0.1:PORT succeeds,
  // curl to [::1]:PORT fails, browser's plain "localhost" fails the same way.
  return _rdProbe('http://127.0.0.1:'+RD_API_PORT).then(function(local){
    if(local){_rdApiBaseCache=local;return local;}
    return fetch('api_endpoint.json',{cache:'no-store'})
      .then(function(r){return r.ok?r.json():null;})
      .catch(function(){return null;})
      .then(function(doc){
        var cloud=(doc&&doc.url)?String(doc.url).replace(/\/+$/,''):null;
        return cloud?_rdProbe(cloud):null;
      })
      .then(function(base){_rdApiBaseCache=base;return base;});
  });
}
function _rdFetchTicker(tk){
  var msgEl=document.getElementById('rd-pin-msg-'+tk);
  _rdGetApiBase().then(function(base){
    if(!base){
      // Two real causes look identical to this code (fetch() only ever
      // surfaces a generic "Failed to fetch" for CORS-blocked requests, so
      // we can't tell them apart): either run_local_api.bat isn't running,
      // or — as of Chrome 142 (Oct 2025) — Chrome's Local Network Access
      // policy is blocking the request even with a running server, and
      // requires an explicit one-time permission grant per site.
      if(msgEl)msgEl.innerHTML='<span style="color:#6f6f6f">No API available. Either <code style="background:#141414;padding:1px 4px;border-radius:3px">run_local_api.bat</code> isn\'t running, '
        +'or Chrome blocked local network access — look for a permission prompt near the address bar, or check '
        +'<code style="background:#141414;padding:1px 4px;border-radius:3px">chrome://settings/content/localNetworkAccess</code> and allow this site, then try again.</span>';
      return;
    }
    var isCloud=base!=='http://127.0.0.1:'+RD_API_PORT;
    if(msgEl&&isCloud)msgEl.innerHTML='<span style="color:#5b9dff;font-size:12px">Computing via cloud API (may take up to a minute if server just woke up)...</span>';
    fetch(base+'/api/ticker?t='+tk,{signal:AbortSignal.timeout(180000)})
      .then(function(r){return r.json();})
      .then(function(data){
        var el=document.getElementById('rd-pin-msg-'+tk);
        if(data.error){
          if(el)el.innerHTML='<span style="color:#6f6f6f">'+data.error+'</span>';
          return;
        }
        var idx=(S.all_signals||[]).findIndex(function(s){return s.ticker===tk;});
        if(idx===-1)(S.all_signals=S.all_signals||[]).push(data);
        else S.all_signals[idx]=data;
        _rdRefreshPinned();
      })
      .catch(function(){
        var el=document.getElementById('rd-pin-msg-'+tk);
        if(el)el.innerHTML='<span style="color:#6f6f6f">Request timed out — try again.</span>';
      });
  });
}

  // ── New format: horizons dict ─────────────────────────────────────────────

window._rdPinTicker=function(raw){

/* URL deep-link: ?pin=TICKER pre-pins on landing, ?pin=A,B,C pins many.
 * Pairs with news-desk's shift-click-to-regime-desk shortcut so a
 * ticker chip there opens this dashboard with the ticker queued up.  */
(function _rdApplyUrlPins(){
  try{
    var p=new URLSearchParams(location.search).get('pin')||'';
    if(!p)return;
    var raw=p.split(',').map(function(s){return s.trim().toUpperCase();}).filter(Boolean);
    if(!raw.length)return;
    // ?pin= renders into the Stocks view, which moved to PAPA. Without this
    // guard the link would still "work" — pin the tickers, then drop the
    // visitor on Home with nothing to show for it.
    if(VIEWS.indexOf('stocks')===-1)return;
    // Force navigation to the stocks view so the user lands where the pins render
    if(location.hash!=='#stocks'){location.hash='#stocks';}
    raw.forEach(function(tk){window._rdPinTicker(tk);});
    // Strip the param so a manual refresh doesn't re-add duplicates
    if(history.replaceState){
      var clean=location.pathname+location.hash;
      history.replaceState(null,'',clean);
    }
  }catch(e){console&&console.warn&&console.warn('pin url:',e);}
})();

  const hs = order.filter(h => c.horizons[h]).map(h => c.horizons[h]);
  if (!hs.length) return '';
  const pct = v => (v * 100).toFixed(1) + '%';
  const cells = hs.map(h => {
    const good = h.ratio >= 0.9;
    const col = h.ratio < 0 ? '#e5484d' : h.ratio < 0.5 ? '#d4a72c' : '#3fae6a';
    return '<div style="flex:1 1 150px;min-width:140px;background:#050505;border:1px solid #141414;border-radius:6px;padding:8px 10px">'

      + '<div style="color:#7d7d7d;font-size:11px">beat SPY ' + (h.beat_rate * 100).toFixed(0) + '% &middot; worst decile ' + pct(h.realized_p10) + '</div>'
      + '<div style="color:#4a4a4a;font-size:10px">n=' + h.n + '</div>'
      + '</div>';
  }).join('');
  return '<div style="background:#0e0e0e;border:1px solid #2e2e2e;border-left:3px solid #d4a72c;border-radius:8px;padding:12px 14px;margin:0 0 14px">'
    + '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:8px">'

    + '<span style="color:#7d7d7d;font-size:11px">measured on ' + c.resolved.toLocaleString() + ' of this engine\'s own predictions, '
    + (c.first_run || '') + ' to ' + (c.last_run || '') + ' &mdash; it beat SPY in <b style="color:#c9c9c9">'
    + ((c.beat_rate || 0) * 100).toFixed(0) + '%</b> of them</span></div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap">' + cells + '</div>'
    + '<div style="color:#7d7d7d;font-size:11px;margin-top:9px;max-width:92ch">'
    + 'Multiply an edge below by its horizon\'s factor to get what edges like it have actually delivered. '
    + 'The gap is not an arithmetic error: a posted edge is the mean of about ten independent historical episodes, '
    + 'selected as the best of roughly 7,800 candidates, so the winners are largely the names whose small samples got luckiest. '
    + '<b style="color:#d4a72c">This table is a research statistic, not a buy list</b> &mdash; it is built to review names you already hold, '
    + 'not to choose new ones.</div></div>';
}

  return`<div class="card"><h2>Individual Stock Signals</h2>${_rdCalPanel()}
  ${_horizonBar()}${filterBar}${wlBar}${lookupBar}
  <div id="rd-pinned-cards"></div>
  <p style="margin-bottom:12px;color:#8f8f8f">${isWl?`Watchlist mode — ${wlTickers.length} ticker${wlTickers.length!==1?'s':''}. `:''}${!isWl?sorted.length+' signals shown':''}.${_horizon!=='all'?' Horizon: '+_horizon+'.':''} Click headers to sort.</p>
  <div style="overflow-x:auto"><table style="min-width:860px"><tr>${th('ticker','Ticker','Stock symbol. The small label under each ticker is the signal horizon — 5 / 20 / 60 / 120 trading days forward.')}${th('name','Name','Company name.')}${th('sector','Sector','Regime-desk sector classification.')}${th('price','Price','Latest close price.')}${th('market_cap','Cap','Market capitalization (T / B / M / K).')}${th('avg_volume','Vol','Average daily share volume.')}${th('edge','Edge','The conditional edge: this ticker’s forward-return signal over the horizon, measured on days historically analogous to today. The value in parentheses is the annualized equivalent. Green = positive, red = negative.')}<th title="Downside case — the 10th-percentile forward return across the analog days.">Bear</th><th title="Central case — the median (50th-percentile) forward return across the analog days.">Median</th><th title="Upside case — the 90th-percentile forward return across the analog days.">Bull</th>${th('hit_rate','Hit%','Share of analog days on which the forward return was positive — the batting average of the signal (Hit edge).')}${th('hit_alpha','Hit (α)','Share of analog days the stock beat SPY over the same forward window. Blank until the daily feed carries it.')}${th('hit_self','Hit (self)','Share of analog days the stock beat its OWN all-history median forward return. Above 50% confirms a positive edge; below 50% flags a name that rises but by less than its own norm under today-like conditions.')}${th('n_obs','n','Number of analog-day observations behind the signal. Higher = more reliable.')}<th title="The ticker’s beta — sensitivity to the broad market (1.0 = moves with the market).">Beta</th><th></th></tr>
  ${rows.join('')}

// RISKS
// ONE risk card, not two. Aggregate Risk Score and Risk Axes & Invalidation
// were the same seven axes rendered twice — the score as a bare percentage up
// top, the reading and its invalidation condition in a separate card four
// panels further down. A bare 83% is a scalar with an ambitious name; an axis
// is a reading, where that reading sits, and what would say the risk has
// arrived. Those three now sit together, which is what "axis" was promising.
//
// The old score card's seven tiles are gone on purpose: they were the same
// numbers as the rows below. The freed space carries the level distribution
// instead, which was never on the page at all.
function _cardRisk(){
  const risks=S.risks||[];
  const scores=risks.map(r=>r.score||0);
  const composite=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;
  const cPct=(composite*100).toFixed(0);
  const cLevel=composite>=0.65?"elevated":composite>=0.45?"moderate":"low";
  const cCol=composite>=0.65?"#e5484d":composite>=0.45?"#d4a72c":"#3fae6a";
  const maxRisk=risks.reduce((a,b)=>(b.score||0)>(a.score||0)?b:a,risks[0]||{});
  const axCol=v=>v>=0.65?'#e5484d':v>=0.45?'#d4a72c':'#3fae6a';
  const lvlOf=v=>(v||0)>=0.65?'elevated':(v||0)>=0.45?'moderate':'low';
  const nAt=lvl=>risks.filter(r=>lvlOf(r.score)===lvl).length;
  const hero=_rdHero('Composite',`${cPct}<span style="font-size:11px;color:#8f8f8f"> /100</span>`,cLevel.toUpperCase(),cCol);
  const tiles=[
    _rdTile('Elevated',`<span style="color:${nAt('elevated')?'#e5484d':'#8f8f8f'}">${nAt('elevated')}</span>`,'',false),
    _rdTile('Moderate',`<span style="color:${nAt('moderate')?'#d4a72c':'#8f8f8f'}">${nAt('moderate')}</span>`,'',false),
    _rdTile('Low',`<span style="color:${nAt('low')?'#3fae6a':'#8f8f8f'}">${nAt('low')}</span>`,'',false),
    _rdTile('Top driver',`<span style="color:${axCol(maxRisk.score||0)};font-size:13px">${maxRisk.name||'—'}</span>`,_rdMiniBar(maxRisk.score,axCol(maxRisk.score||0)),false)
  ].join('');
  // ── ONE LINE PER AXIS, WITH A REAL METER ────────────────────────────────
  //
  // Owner, 2026-09-11: "fit them all on one line again with an actual meter for
  // the metric and a 30 and 90 day range for each metric" — and, separately,
  // that the first screen only reached Rate Re-pricing. Both are the same fault:
  // seven three-line blocks cannot fit above the fold, so the card that is meant
  // to be read at a glance was something you scrolled through.
  //
  // The meter is the honest part. A score of 59 is not high or low until you
  // know where this axis has been: the faint band is its 90-day range, the solid
  // band the last 30 days, the two grey ticks are the 45 and 65 thresholds where
  // the level changes, and the bright marker is today. An axis pinned at the top
  // of its own 90-day range is a different statement from the same number
  // sitting mid-range, and that difference is the whole reason to draw a bar.
  //
  // The description and the invalidation condition move to the row's tooltip.
  // They were never the thing being scanned for; they are what you check once a
  // row has caught your eye.
  // ── WHAT EACH AXIS ACTUALLY MEASURES ────────────────────────────────────
  //
  // Owner, 2026-09-14: the tooltip should say what is being measured here,
  // not recite the metrics. The metrics were never missing — VIX, HYG, TLT,
  // CPER, IWM, TIP, UUP and SPY are all published in full in the Cross-Asset
  // panel — so a tooltip repeating them was the same reading answered twice,
  // and it crowded out the one thing this card could not tell you: what
  // question the axis is asking.
  //
  // This is caption copy, not data. It never changes with a snapshot, so it
  // lives in the view and renders whatever the build produced. An axis added
  // upstream without a caption here falls back to its description rather than
  // opening a blank tooltip.
  const AX_MEASURES={
    "Volatility Regime":
      "How much movement the options market is pricing into the coming month. "+
      "High readings mean protection is expensive and the tails are being quoted wider than normal.",
    "Credit Stress":
      "Whether lenders are still willing to fund the weaker end of the borrower stack. "+
      "High yield is where funding stress surfaces first, usually while equities are still marking fine.",
    "Rate Re-pricing":
      "Whether the long end is moving against duration. This is the axis that hits long-duration "+
      "equity and the bond sleeve at the same time, which is why it rarely shows up as diversification.",
    "Growth Slowdown":
      "Whether the cyclical, domestically-levered end of the market is confirming a growth scare or denying one. "+
      "Copper and small caps re-price ahead of the macro prints they are supposedly reacting to.",
    "Inflation Re-pricing":
      "Whether inflation expectations are drifting off anchor. Read from breakeven behaviour rather than "+
      "realised CPI, so it moves before the print rather than after it.",
    "Dollar Headwind":
      "Whether FX is working for or against overseas earnings and dollar-priced commodities. "+
      "A strong dollar is a translation drag on multinational revenue and a direct headwind to commodity exposure.",
    "Complacency Risk":
      "Whether the market has been rising while pricing less risk, not more. "+
      "It is the one axis where the benign-looking reading is the warning."
  };
  const TH_MOD=45, TH_ELEV=65;
  function meter(r){
    const col=axCol(r.score||0);
    const pct=Math.max(0,Math.min(100,(r.score||0)*100));
    // A RANGE WE DO NOT HAVE IS DRAWN AS NOTHING, never as a zero-width band at
    // today's value — that would read as "this has not moved in three months",
    // which is the opposite of "it could not be measured".
    const has30=r.range30&&typeof r.range30.lo==="number";
    const has90=r.range90&&typeof r.range90.lo==="number";
    const band=(rg,cls)=>{
      if(!rg)return"";
      const lo=Math.max(0,Math.min(100,rg.lo*100)),hi=Math.max(0,Math.min(100,rg.hi*100));
      return`<span class="${cls}" style="left:${lo}%;width:${Math.max(1.2,hi-lo)}%;background:${col}"></span>`;
    };
    return`<span class="rax-meter">
      ${has90?band(r.range90,"rax-b90"):""}
      ${has30?band(r.range30,"rax-b30"):""}
      <span class="rax-tick" style="left:${TH_MOD}%"></span>
      <span class="rax-tick" style="left:${TH_ELEV}%"></span>
      <span class="rax-now" style="left:calc(${pct}% - 1.5px)"></span>
    </span>`;
  }
  const rngTxt=rg=>rg&&typeof rg.lo==="number"
    ?`${(rg.lo*100).toFixed(0)}–${(rg.hi*100).toFixed(0)}`
    :`<span style="color:#4a4a4a">n/a</span>`;
  // ---- CLICK AN AXIS TO SEE HOW ITS NUMBER WAS MADE ----------------------
  //
  // Owner, 2026-09-14: "this has just become a screen of numbers and I don't
  // know what they all mean." The gap is not the finance - it is that nothing
  // on screen connected a VIX of 17.0 to a score of 18.
  //
  // So the panel shows the reading, then INVERTS the formula. "Volatility
  // Regime 18" is inert; "VIX is 17.0, and it would take 24.6 to turn this
  // amber" is the same fact with a handle on it. Those thresholds are solved
  // upstream from each axis's own function rather than written down here, so
  // this panel cannot promise a colour change the meter does not make.
  //
  // A line already crossed is marked as crossed, never described as something
  // that might happen. Growth Slowdown sits at 80 with its inputs at -9.9%
  // against a -5.0% trigger; printing "red at -5.0%" without saying "you are
  // past it" reads as a warning about the future instead of a description of
  // now - the wrong way round for the one axis currently elevated.
  function why(r){
    const e=r.explain||{}, sc=(r.score||0), has=e.input_value!=null;
    const chip=(lab,val,cls)=>`<span class="rax-chip ${cls||''}">${lab} <b>${val}</b></span>`;
    let chips="";
    if(has){
      chips+=chip(e.input_label+":", e.input_value);
      // Past vs upcoming is read off the SCORE, never by comparing the
      // formatted strings: the input can run in either direction, and "-1.5%"
      // against "+0.5%" is not a comparison string order knows how to make.
      if(e.moderate_at!=null) chips+=chip("amber at", e.moderate_at, sc>=TH_MOD/100?"past":"next");
      if(e.elevated_at!=null) chips+=chip("red at", e.elevated_at, sc>=TH_ELEV/100?"past":"next");
    }
    const dirn=e.input_rises===false?"falls to":"reaches";
    const state=!has?""
      : sc>=TH_ELEV/100 ? `Both lines are already behind it. This axis is <b>elevated now</b>, not heading there.`
      : sc>=TH_MOD/100 ? `Past the amber line already. It turns red when ${e.input_label} ${dirn} ${e.elevated_at}.`
      : `Below both lines. It turns amber when ${e.input_label} ${dirn} ${e.moderate_at}.`;
    const r90=r.range90, r30=r.range30;
    const rng=(r90&&typeof r90.lo==="number")
      ? `<h4>Whether that is high for this axis</h4><p>Over 90 days it has run
         ${(r90.lo*100).toFixed(0)}-${(r90.hi*100).toFixed(0)}; over 30,
         ${(r30&&typeof r30.lo==="number")?`${(r30.lo*100).toFixed(0)}-${(r30.hi*100).toFixed(0)}`
           :"too little history to say"}. Today is ${(sc*100).toFixed(0)}.</p>` : "";
    return `<div class="rax-why" id="why-${r.name.replace(/\W+/g,'')}" hidden>
      <div class="rax-why-in">
        <h4>What this measures</h4><p>${AX_MEASURES[r.name]||r.description}</p>
        ${has?`<h4>What it is reading, and what would move it</h4>
          <div class="rax-sum">${chips}</div>
          <p>${state}${e.note?` <span style="color:#8f8f8f">${e.note}</span>`:""}</p>`:""}
        ${rng}
        <h4>Today, in words</h4><p>${r.description}</p>
        <h4>What would say the risk has passed</h4><p>${r.invalidation}</p>
      </div>
    </div>`;
  }

  const rows=risks.map(r=>{
    const col=axCol(r.score||0);
    const tip=`${r.name} — ${AX_MEASURES[r.name]||r.description}\n\nClick the row for how this number is made.`
      .replace(/"/g,"&quot;");
    const id="why-"+r.name.replace(/\W+/g,'');
    return`<div class="rax" title="${tip}" role="button" tabindex="0"
        aria-expanded="false" aria-controls="${id}" data-why="${id}">
      <span class="rax-name" style="color:${col}">${r.name}</span>
      ${meter(r)}
      <span class="rax-rng">30d ${rngTxt(r.range30)}</span>
      <span class="rax-rng">90d ${rngTxt(r.range90)}</span>
      <span class="rax-val" style="color:${col}">${((r.score||0)*100).toFixed(0)}</span>
      <span class="rax-chev">&#9654;</span>
    </div>${why(r)}`;
  }).join('');
  const anyRange=risks.some(r=>r.range90&&typeof r.range90.lo==="number");
  const foot=`${pill(cLevel)} across ${risks.length} axes · bar is 0–100; solid band is the last 30 days, faint band the last 90, grey ticks the 45 and 65 level thresholds, bright mark today. ${anyRange?"":"Ranges are unavailable in this snapshot and are shown as n/a rather than guessed. "}Click any row, or any tile above, for what it measures and what would move it.`;
  return`<div class="card" style="border-left:4px solid ${cCol};padding-left:11px"><h2>Risk Axes</h2>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin-bottom:12px">${hero}${tiles}</div>
  ${rows}
  <div style="margin-top:2px;padding-top:9px;color:#6f6f6f;font-size:12px;border-top:1px solid #2e2e2e;line-height:1.6">${foot}</div></div>`;
}
